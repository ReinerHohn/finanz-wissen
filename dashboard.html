const DATA = [{"id": "aktiv-vs-passiv", "name": "Aktive Fonds vs. Index-ETF: Warum 'passiv' meist gewinnt", "aka": ["Aktiv vs Passiv", "Stockpicking", "SPIVA"], "category": "Kosten", "evidence_level": "A", "tags": ["aktiv", "passiv", "spiva", "fondsmanager", "kosten"], "summary": "Ein aktiver Fonds versucht, durch Auswahl 'besserer' Aktien den Markt zu schlagen. Die Daten über Jahrzehnte sind eindeutig: Nach Kosten schafft das nur eine Minderheit, und über lange Zeiträume schlägt fast keiner dauerhaft seinen Vergleichsindex. Ein billiger Index-ETF nimmt einfach den Marktdurchschnitt mit – und liegt damit langfristig vor der Mehrheit der Profis.", "kernidee": "Den Markt zu schlagen ist möglich, aber selten und selten dauerhaft. Der Durchschnitt (Index) zu sein, schlägt nach Kosten die meisten Aktiven.", "deep_dive": "Der Grund ist teils simpel-mathematisch (William Sharpe, 'Arithmetic of Active Management'): Alle Anleger zusammen sind der Markt, also ist die Durchschnittsrendite aller Aktiven vor Kosten gleich dem Markt – und nach ihren höheren Kosten zwangsläufig darunter. Die SPIVA-Studien von S&P bestätigen das seit Jahren: Über 10–15 Jahre schlagen 80–90 % der aktiven Aktienfonds ihren Vergleichsindex NICHT. Dazu kommt: Wer heute vorn liegt, ist es morgen selten noch ('keine Persistenz') – Vergangenheits-Ranglisten helfen kaum bei der Auswahl. Das heißt nicht, dass Können nicht existiert; es ist nur teuer, schwer im Voraus zu erkennen und wird von Gebühren aufgefressen. Für Privatanleger ist die robuste Schlussfolgerung: breit, billig, passiv – statt auf den einen Star-Fonds zu wetten.", "key_facts": [{"label": "Langfrist-Bilanz", "value": "Über 10–15 Jahre schlagen rund 80–90 % der aktiven Aktienfonds ihren Index nicht.", "source": "S&P SPIVA Scorecards"}, {"label": "Sharpe-Argument", "value": "Der Durchschnitt aller Aktiven ist vor Kosten = Markt; nach Kosten zwangsläufig darunter.", "source": "Sharpe 1991, 'Arithmetic of Active Management'"}, {"label": "Keine Persistenz", "value": "Heutige Top-Fonds bleiben selten oben – Vergangenheitsrenditen sagen kaum Zukunft voraus."}, {"label": "Survivorship Bias", "value": "Schlechte Fonds werden geschlossen/verschmolzen; Ranglisten sehen dadurch besser aus als die Realität war."}], "misconceptions": ["'Profis schlagen doch sicher den Markt.' – Die Mehrheit tut es nach Kosten langfristig nicht.", "'Ich nehme einfach den Fonds mit der besten 5-Jahres-Rendite.' – Kaum ein Prädiktor; Gewinner wechseln ständig.", "'Passiv heißt, ich verzichte auf Rendite.' – Passiv nimmt den Marktschnitt und liegt damit vor den meisten Aktiven."], "related": ["ter-und-kosten", "was-ist-ein-etf", "welt-etf-auswaehlen"], "sources": [{"title": "S&P SPIVA Scorecards", "url": "https://www.spglobal.com/spdji/en/research-insights/spiva/"}, {"title": "Sharpe: The Arithmetic of Active Management (1991)", "url": "https://web.stanford.edu/~wfsharpe/art/active/active.htm"}]}, {"id": "anlagehorizont", "name": "Anlagehorizont: welches Geld gehört wohin?", "aka": ["Zeithorizont", "Töpfe-Modell", "Buckets", "wann Aktien passen"], "category": "Depot & Strategie", "evidence_level": "A", "tags": ["anlagehorizont", "zeithorizont", "toepfe", "liquiditaet", "planung"], "summary": "Nicht jedes Geld gehört in Aktien – entscheidend ist, WANN du es brauchst. Kurzfristig benötigtes Geld (0–3 Jahre) gehört auf sichere Konten, denn Aktien können genau dann tief im Minus stehen. Nur Geld, das du 10+ Jahre nicht anfassen musst, sollte breit in Aktien-ETFs arbeiten. Das ist der eine legitime Grund, NICHT sofort alles in Aktien zu stecken – und er hat nichts mit Timing zu tun.", "kernidee": "Ordne dein Geld nach dem Zeitpunkt, an dem du es brauchst – nicht nach dem Börsenwetter. Zeit, nicht Timing, entscheidet über die passende Anlage.", "deep_dive": "Ein einfaches Töpfe-Modell hilft: (1) Kurzfristig (0–3 Jahre) – Notgroschen und geplante Ausgaben (Auto, Umzug, Steuer): auf Tagesgeld/Festgeld, kein Kursrisiko (siehe notgroschen-zuerst). (2) Mittelfristig (3–10 Jahre) – Mischung, mit vorsichtigerem Aktienanteil, damit ein Crash kurz vor dem Ziel nicht alles kostet. (3) Langfristig (10+ Jahre) – hier gehören breite Aktien-ETFs hin, weil über so lange Zeiträume die Schwankungen ausgesessen werden können und die reale Rendite wirkt (siehe sind-etfs-sicher). Der Grund für diese Trennung ist das Kursrisiko zum falschen Zeitpunkt: Aktien können -40 bis -55 % stehen; wer das Geld dann braucht, muss den Verlust realisieren. Wichtig: Das ist KEIN Market-Timing. Du wartest nicht auf einen 'guten Moment' (das wäre der teure Reflex, siehe markt-timing-jetzt-ist-schlecht), sondern richtest die Anlage nach deinem festen Zeitbedarf aus. Für dein lange herumliegendes Geld heißt das konkret: Der Teil, den du 10+ Jahre sicher nicht brauchst, sollte HEUTE anfangen zu arbeiten – am besten automatisiert (siehe sparplan-als-automatik) – statt auf besseres Wetter zu warten.", "key_facts": [{"label": "0–3 Jahre", "value": "Sicheres Konto (Tagesgeld/Festgeld) – kein Kursrisiko, weil keine Zeit zum Aussitzen bleibt."}, {"label": "3–10 Jahre", "value": "Mischung mit vorsichtigerem Aktienanteil, gegen Ende risikoärmer werden."}, {"label": "10+ Jahre", "value": "Breite Aktien-ETFs – lange genug, um Crashs auszusitzen und reale Rendite zu ernten."}, {"label": "Der Grund", "value": "Aktien können -50 % stehen; wer das Geld dann braucht, realisiert den Verlust."}, {"label": "Kein Timing", "value": "Du richtest dich nach deinem Zeitbedarf, nicht nach dem 'richtigen Moment'."}], "misconceptions": ["'Alles gehört sofort komplett in Aktien.' – Nur langfristiges Geld; kurzfristiges gehört sicher angelegt.", "'Ich warte mit dem Langfrist-Geld auf einen besseren Moment.' – Das ist Timing; bei 10+ Jahren zählt der Einstiegstag kaum.", "'Aktien sind für kurzfristige Ziele okay, wenn ich vorsichtig bin.' – Das Kursrisiko trifft dich unabhängig von Vorsicht."], "related": ["notgroschen-zuerst", "depot-aufteilung-assetallokation", "sind-etfs-sicher", "markt-timing-jetzt-ist-schlecht", "entnahmephase"], "sources": [{"title": "Verbraucherzentrale: Anlageziele & Zeithorizont", "url": "https://www.verbraucherzentrale.de/wissen/geldanlage"}]}, {"id": "anlegerfehler-uebersicht", "name": "Die häufigsten Anlegerfehler auf einen Blick", "aka": ["Behavior Gap", "typische Fehler", "Verhaltensfallen"], "category": "Psychologie & Verhalten", "evidence_level": "B", "tags": ["fehler", "psychologie", "behavior-gap", "panikverkauf", "gebuehren"], "summary": "Die meiste Rendite geht nicht durch schlechte Märkte verloren, sondern durch das eigene Verhalten: Panikverkäufe, Performance-Jagd, zu viel Handeln, zu hohe Kosten und ständiges Draufschauen. Studien nennen diese Lücke zwischen Fonds-Rendite und tatsächlicher Anleger-Rendite den 'Behavior Gap'.", "kernidee": "Der größte Gegner des Anlegers ist meist der Anleger selbst. Wer die typischen Fehler kennt und vermeidet, hat den halben Erfolg schon sicher.", "deep_dive": "Untersuchungen (z. B. Morningstar 'Mind the Gap', DALBAR) zeigen regelmäßig: Anleger verdienen spürbar weniger als die Fonds, in die sie investieren – weil sie zum falschen Zeitpunkt ein- und aussteigen. Die häufigsten Fehler: (1) Panikverkauf im Crash – realisiert Verluste und verpasst die Erholung (siehe time-in-the-market). (2) Performance-Jagd – dem heißen Fonds/Trend hinterherlaufen, der danach oft abkühlt (vergangene Rendite sagt wenig, siehe aktiv-vs-passiv). (3) Market-Timing – auf den 'richtigen Moment' warten (siehe markt-timing-jetzt-ist-schlecht). (4) Zu viel Handeln – jeder Trade kostet Gebühren, Steuern und meist Rendite. (5) Kosten ignorieren – hohe TER/Ausgabeaufschläge fressen über Jahrzehnte einen großen Teil weg (siehe ter-und-kosten). (6) Zu enge Streuung / Home Bias – zu viel Heimatmarkt oder Einzelaktien statt breit weltweit (siehe diversifikation-vs-marktrisiko). (7) Zu oft ins Depot schauen – erhöht Angst und die Neigung, unnötig einzugreifen. Die Gegenmittel sind langweilig und wirksam: breiter Welt-ETF, Sparplan-Automatik, niedrige Kosten, lange dabeibleiben, selten draufschauen.", "key_facts": [{"label": "Behavior Gap", "value": "Anleger erzielen oft spürbar weniger als ihre eigenen Fonds – durch schlechtes Timing beim Ein-/Aussteigen.", "source": "Morningstar 'Mind the Gap'"}, {"label": "Panikverkauf", "value": "Der teuerste Einzelfehler: Verlust realisieren und die Erholung verpassen."}, {"label": "Performance-Jagd", "value": "Dem letztjährigen Gewinner hinterherlaufen – der oft danach zurückfällt."}, {"label": "Zu viel Handeln", "value": "Häufiges Umschichten kostet Gebühren, Steuern und meist Rendite; Nichtstun ist oft besser."}, {"label": "Zu oft schauen", "value": "Wer täglich ins Depot schaut, sieht mehr Verlusttage und neigt eher zu Fehlreaktionen."}], "misconceptions": ["'Ich muss aktiv reagieren, um erfolgreich zu sein.' – Meist ist diszipliniertes Nichtstun überlegen.", "'Der beste Fonds des letzten Jahres ist die beste Wahl.' – Vergangenheitsrendite ist ein schwacher Wegweiser.", "'Ich behalte den Überblick, wenn ich oft ins Depot schaue.' – Häufiges Draufschauen erhöht vor allem Stress und Fehlreaktionen."], "related": ["markt-timing-jetzt-ist-schlecht", "time-in-the-market", "sparplan-als-automatik", "aktiv-vs-passiv", "ter-und-kosten"], "sources": [{"title": "Morningstar: Mind the Gap (Investor Returns)", "url": "https://www.morningstar.com/lp/mind-the-gap"}, {"title": "Carl Richards: The Behavior Gap", "url": "https://behaviorgap.com/"}]}, {"id": "anleihen-und-tagesgeld", "name": "Anleihen & Tagesgeld: der sichere Gegenpol zu Aktien", "aka": ["Bonds", "Festgeld", "Staatsanleihen", "sicherer Teil"], "category": "Depot & Strategie", "evidence_level": "A", "tags": ["anleihen", "tagesgeld", "festgeld", "sicherheit", "ballast", "zinsen"], "summary": "Der sichere Teil deines Depots hat nicht die Aufgabe, Rendite zu bringen, sondern Ruhe: Er schwankt kaum und federt Aktien-Crashs ab. Für die meisten Privatanleger reichen Tagesgeld und Festgeld (einfach, einlagengesichert). Anleihen sind Kredite an Staaten/Firmen – als ETF möglich, aber mit eigenen Feinheiten (Zinsänderungsrisiko).", "kernidee": "Der sichere Teil ist der Ballast, nicht der Motor. Seine Aufgabe ist Stabilität, damit du den Aktienteil im Crash aushältst.", "deep_dive": "Tagesgeld: täglich verfügbar, Zins variabel, in der EU bis 100.000 € je Bank/Kunde gesetzlich gesichert – ideal für Notgroschen (siehe notgroschen-zuerst) und den sicheren Depotteil. Festgeld: fester Zins für feste Laufzeit, ebenfalls einlagengesichert, dafür während der Laufzeit gebunden. Anleihen: Du leihst einem Staat oder Unternehmen Geld und bekommst Zinsen (Kupon) plus am Ende den Nennwert zurück. Zwei Risiken: (1) Bonität – Staatsanleihen guter Länder gelten als sehr sicher, Unternehmens-/Schwellenländeranleihen zahlen mehr Zins, sind aber riskanter. (2) Zinsänderungsrisiko – steigen die Marktzinsen, fallen die Kurse bereits laufender Anleihen (2022 war so ein Jahr, in dem selbst 'sichere' Anleihen-ETFs deutlich fielen). Faustregel: Je länger die Restlaufzeit ('Duration'), desto stärker dieser Effekt. Für den sicheren Teil wählt man deshalb kurze Laufzeiten oder gleich Tagesgeld/Festgeld. Warum überhaupt sicher beimischen? Der sichere Teil bricht im Aktien-Crash nicht mit ein – das dämpft das Gesamtminus und gibt dir Mittel, um im Tief nachzukaufen oder einfach ruhig zu bleiben. Für Einsteiger gilt: Tagesgeld + Festgeld sind völlig ausreichend; ein Anleihen-ETF ist optional und lohnt eher bei größeren Vermögen.", "key_facts": [{"label": "Aufgabe", "value": "Stabilität, nicht Rendite – Ballast, der Aktien-Crashs abfedert."}, {"label": "Tagesgeld/Festgeld", "value": "Einfach, in der EU bis 100.000 €/Bank gesichert; Tagesgeld täglich verfügbar, Festgeld fest gebunden."}, {"label": "Anleihe = Kredit", "value": "Du leihst Staat/Firma Geld gegen Zins; Bonität und Laufzeit bestimmen das Risiko."}, {"label": "Zinsänderungsrisiko", "value": "Steigende Zinsen drücken Kurse laufender Anleihen (2022: auch 'sichere' Anleihen-ETFs fielen deutlich); kurze Laufzeit = geringeres Risiko."}, {"label": "Für Einsteiger", "value": "Tagesgeld + Festgeld reichen; ein Anleihen-ETF ist Kür, eher für größere Vermögen."}], "misconceptions": ["'Anleihen sind immer sicher.' – Zinsanstiege und schlechte Schuldner können Verluste bringen; 2022 fielen Anleihen-ETFs deutlich.", "'Der sichere Teil soll auch gut Rendite machen.' – Nein, seine Aufgabe ist Stabilität; Rendite kommt vom Aktienteil.", "'Tagesgeld ist rausgeworfenes Geld.' – Es ist der Puffer, der dir erlaubt, den Aktienteil im Crash zu halten."], "related": ["depot-aufteilung-assetallokation", "rebalancing-eigenes-depot", "notgroschen-zuerst", "inflation-nominal-vs-real"], "sources": [{"title": "BaFin: Anleihen – Grundlagen", "url": "https://www.bafin.de/DE/Verbraucher/GeldanlageWertpapiere/Anleihen/anleihen_node.html"}, {"title": "Verbraucherzentrale: Tagesgeld & Festgeld", "url": "https://www.verbraucherzentrale.de/wissen/geldanlage/sparen-und-anlegen"}]}, {"id": "bip-messproblem-qualitaetsbereinigung", "name": "Das Messproblem: teureres iPhone – wo ist das Wachstum?", "aka": ["Qualitätsbereinigung", "hedonische Methode", "Inflation vs Verbesserung"], "category": "Wirtschaft & Wachstum", "evidence_level": "B", "tags": ["messung", "qualitaetsbereinigung", "hedonisch", "bip", "inflation", "gewinn"], "summary": "Bei jeder Preiserhöhung müssen Statistiker trennen: Ist das Inflation (dasselbe kostet mehr) oder reales Wachstum (man bekommt ein besseres Produkt)? Das Werkzeug heißt hedonische Qualitätsbereinigung. Ist ein neues Produkt teurer, ohne mehr zu können, gilt es korrekt gemessen als reine Inflation – kein Wachstum. Diese Trennung ist genuin schwierig und umstritten. Für dich als Anleger ist der bessere Maßstab ohnehin nicht das BIP, sondern der Gewinn – über den der Markt abstimmt.", "kernidee": "Teurer + gleiche Leistung = Inflation, kein Wachstum. Die Messung dieser Grenze ist unsauber – aber als Anleger zählt der Gewinn, nicht die BIP-Statistik.", "deep_dive": "Hedonische Bereinigung zerlegt ein Produkt in Eigenschaften (Speicher, Kamera, Tempo) und schätzt deren Wert. Kostet ein neues iPhone 10 % mehr, kann aber 30 % mehr, wird das effektiv als Preissenkung pro Leistung verbucht = reales Wachstum. Kostet es 10 % mehr und kann nichts mehr, zählen die vollen 10 % als reine Inflation = KEIN Wachstum. In genau diesem Fall ist die Skepsis 'wo ist das Wachstum?' also berechtigt – korrekt gemessen gibt es keins. Die ehrliche Wahrheit: Die Messung ist wirklich unsauber und umstritten. Mal wird zu VIEL Wachstum gutgeschrieben (Mini-Verbesserungen, die niemand nutzt, zählen als Fortschritt). Mal wird zu WENIG gezählt: Google Maps ersetzte ein 200-€-Navi gratis, Wikipedia eine ganze Enzyklopädie – riesiger realer Nutzen, der im BIP kaum auftaucht, weil er nichts kostet. BIP und Inflation sind also gute, aber unvollkommene Schätzungen. Der entscheidende Perspektivwechsel für Anleger: Du verdienst nicht 'BIP' und nicht 'bessere Features', sondern GEWINN. Teureres iPhone, das nichts mehr kann, aber trotzdem gekauft wird -> Apples Gewinn steigt real -> dein Anteil steigt (echter Zugewinn, egal ob 'besser'). Wird es den Leuten nicht wert sein -> weniger Verkäufe -> Gewinn fällt -> Aktie fällt. Der Markt korrigiert das selbst. Und im breiten ETF sammelt sich Gewicht automatisch dort, wo real Gewinn entsteht – du musst die iPhone-Frage nicht selbst beantworten.", "key_facts": [{"label": "Die Kernfrage", "value": "Jede Preiserhöhung muss in 'Inflation' vs 'bessere Leistung' zerlegt werden – das ist die ganze Schwierigkeit."}, {"label": "Hedonische Methode", "value": "Produkt in Eigenschaften zerlegen und deren Wert schätzen; mehr Leistung pro Euro = reales Wachstum."}, {"label": "Dein Fall", "value": "Teurer + kann nichts mehr = korrekt gemessen reine Inflation, KEIN Wachstum. Skepsis berechtigt."}, {"label": "Umstritten in beide Richtungen", "value": "Mal zu viel Wachstum (Mini-Features), mal zu wenig (Gratis-Dienste wie Maps/Wikipedia fehlen im BIP)."}, {"label": "Anleger-Maßstab: Gewinn", "value": "Du verdienst Gewinn, nicht Features. Der Markt stimmt über den Kurs ab, ob eine Preiserhöhung echten Wert schafft."}], "misconceptions": ["'Teureres Produkt = automatisch Wachstum.' – Nur wenn es real mehr leistet; sonst ist es Inflation.", "'Das BIP misst Fortschritt exakt.' – Es ist ein guter, aber unvollkommener Näherungswert (Gratis-Dienste fehlen, Mini-Features werden überschätzt).", "'Als Anleger muss ich beurteilen, ob ein Produkt besser ist.' – Nein, der Markt und die Index-Gewichtung erledigen das über den Gewinn."], "related": ["wirtschaftswachstum-real", "inflation-nominal-vs-real", "warum-aktien-langfristig-steigen", "marktkapitalisierung-gewichtung"], "sources": [{"title": "BLS: Hedonic Quality Adjustment in the CPI", "url": "https://www.bls.gov/cpi/quality-adjustment/"}, {"title": "Our World in Data: What is GDP and what does it (not) measure?", "url": "https://ourworldindata.org/what-is-gdp"}]}, {"id": "broker-depot-auswahl", "name": "Broker & Depot auswählen", "aka": ["Wertpapierdepot", "Neobroker vs Direktbank", "Depoteröffnung"], "category": "Praxis / Erste Schritte", "evidence_level": "B", "tags": ["broker", "depot", "kosten", "sparplan", "sondervermoegen", "praxis"], "summary": "Ein Depot ist das Konto, in dem deine ETFs liegen; der Broker ist der Anbieter dieses Kontos. Wichtig bei der Auswahl: niedrige/keine Depotgebühr, günstige oder kostenlose Sparpläne, Regulierung in der EU und – in Deutschland praktisch – automatische Steuerabführung. Deine ETFs sind Sondervermögen und damit vor einer Pleite des Brokers geschützt.", "kernidee": "Depot = Aufbewahrungsort deiner ETFs. Achte auf Kosten, kostenlose Sparpläne und EU-Regulierung; das Wertpapier selbst ist bei Broker-Pleite geschützt.", "deep_dive": "Grob zwei Anbietertypen: (1) Neobroker (App-basiert, sehr günstig, oft 0 € Depotgebühr und kostenlose Sparpläne, teils schlankerer Service). (2) Direktbanken (etwas teurer, dafür breiteres Angebot, Telefon-Service, oft alles unter einem Dach). Beide sind für einen simplen Welt-ETF-Sparplan geeignet. Auswahl-Checkliste: (a) Depotführung kostenlos. (b) ETF-Sparpläne kostenlos oder sehr günstig, und der/die von dir gewünschten ETFs sparplanfähig. (c) Ordergebühren niedrig (für Einmalkäufe). (d) In der EU reguliert (BaFin oder EU-Pass) und mit deutscher Steuerabführung, wenn du dir die Steuererklärung erleichtern willst – bei inländischen Brokern werden Abgeltungsteuer und Vorabpauschale automatisch abgeführt (siehe vorabpauschale-steuern-de), bei ausländischen musst du das selbst in der Steuererklärung erledigen. (e) Bedienbarkeit/App, Freistellungsauftrag einfach einrichtbar. WICHTIG zur Sicherheit: Deine ETFs sind Sondervermögen und gehören bei einer Broker-Pleite weiter dir; sie fallen NICHT unter die 100.000-€-Einlagensicherung (die gilt für Bargeld auf Konten), sondern sind als Wertpapiere getrennt geschützt. Nicht auf Lockangebote (Neukundenprämien) fixieren – wichtiger sind dauerhaft niedrige Kosten und dass dein Wunsch-ETF sparplanfähig ist. Ein Wechsel des Brokers ist später möglich (Depotübertrag), aber lästig – einmal ordentlich wählen spart Ärger.", "key_facts": [{"label": "Depot vs Broker", "value": "Depot = Aufbewahrungskonto für Wertpapiere; Broker = Anbieter, über den du kaufst/verkaufst."}, {"label": "Checkliste", "value": "Kostenlose Depotführung · kostenlose/günstige Sparpläne · Wunsch-ETF sparplanfähig · niedrige Ordergebühr · EU-reguliert."}, {"label": "Steuer-Komfort (DE)", "value": "Inländische Broker führen Abgeltungsteuer + Vorabpauschale automatisch ab; bei ausländischen musst du das selbst erklären."}, {"label": "Sicherheit", "value": "ETFs sind Sondervermögen – bei Broker-Pleite geschützt; das ist getrennt von der Einlagensicherung für Bargeld."}, {"label": "Nicht von Prämien blenden lassen", "value": "Dauerhaft niedrige Kosten und Sparplan-Fähigkeit zählen mehr als einmalige Neukunden-Boni."}], "misconceptions": ["'Bei Broker-Pleite ist mein ETF weg.' – Nein, ETFs sind Sondervermögen und bleiben deins.", "'Die Einlagensicherung schützt meine ETFs.' – Nein, die 100.000 € gelten für Bargeld/Konten; Wertpapiere sind separat geschützt.", "'Der Broker mit der höchsten Neukundenprämie ist am besten.' – Wichtiger sind laufende Kosten und Sparplan-Angebot."], "related": ["sparplan-als-automatik", "welt-etf-auswaehlen", "vorabpauschale-steuern-de", "ter-und-kosten"], "sources": [{"title": "Finanztip: Depot-Vergleich & Auswahl", "url": "https://www.finanztip.de/geldanlage/wertpapierdepot/"}, {"title": "BaFin: Wertpapierdepot & Anlegerschutz", "url": "https://www.bafin.de/DE/Verbraucher/GeldanlageWertpapiere/geldanlage_node.html"}]}, {"id": "depot-aufteilung-assetallokation", "name": "Depot-Aufteilung: der risikoreiche und der sichere Teil", "aka": ["Asset-Allokation", "Vermögensaufteilung", "Risikoteil/Sicherheitsteil", "Core-Satellite"], "category": "Depot & Strategie", "evidence_level": "A", "tags": ["assetallokation", "aufteilung", "risiko", "strategie", "70-30"], "summary": "Die wichtigste Entscheidung ist nicht WELCHER ETF, sondern WIE VIEL in risikoreiche (Aktien) und wie viel in sichere Anlagen (Tagesgeld/Anleihen) geht. Diese Aufteilung – die Asset-Allokation – bestimmt den Großteil deiner Schwankung und deines Nachtschlafs. Grundmodell: ein risikoreicher Topf (Welt-ETF) plus ein sicherer Topf (Tagesgeld/kurze Anleihen).", "kernidee": "Erst das Verhältnis Aktien/sicher festlegen, dann die Produkte. Die Aufteilung ist die eigentliche Stellschraube für dein Risiko.", "deep_dive": "Studien zeigen: Ein sehr großer Teil der Schwankung eines Portfolios kommt aus der Aufteilung zwischen Anlageklassen, nicht aus der Einzelauswahl. Praktisch reicht ein einfaches Zwei-Topf-Modell: (1) Risikoteil = ein breiter Welt-Aktien-ETF (siehe welt-etf-auswaehlen) – liefert die Rendite, schwankt aber stark (-40 bis -55 % möglich). (2) Sicherheitsteil = Tagesgeld/Festgeld oder kurzlaufende Staatsanleihen (siehe anleihen-und-tagesgeld) – kaum Rendite, aber Ballast, der das Gesamtdepot ruhiger macht. Wie hoch der Aktienanteil sein sollte, hängt von zwei Dingen ab: deinem Anlagehorizont (siehe anlagehorizont) und deiner Risikotoleranz (wie viel Minus hältst du aus, ohne zu verkaufen?). Faustregeln als Startpunkt, nicht als Gesetz: 'sicherer Teil in % ungefähr wie dein Alter' oder klassische Mischungen wie 70/30 oder 60/40 (Aktien/sicher). Ehrlicher Test: Stell dir -50 % auf dem Aktienteil vor. Bei welchem Aktienanteil kannst du da noch ruhig schlafen und NICHT verkaufen? Genau der ist für dich richtig – ein Depot, das du im Crash durchhältst, schlägt ein 'optimales', das du panisch auflöst. Wer es maximal einfach will: EIN Welt-ETF plus Tagesgeld genügt völlig; mehr Bausteine sind Kür, nicht Pflicht.", "key_facts": [{"label": "Wichtigste Entscheidung", "value": "Das Verhältnis Aktien/sicher bestimmt den Großteil der Schwankung – mehr als die Produktauswahl."}, {"label": "Zwei-Topf-Modell", "value": "Risikoteil (Welt-ETF) + Sicherheitsteil (Tagesgeld/kurze Anleihen). Reicht für die meisten völlig."}, {"label": "Faustregeln", "value": "Startpunkte: sicherer Teil ~ Alter in %, oder 70/30 bzw. 60/40 – anpassen an Horizont und Nerven."}, {"label": "Der ehrliche Test", "value": "Bei welchem Aktienanteil hältst du -50 % aus, ohne zu verkaufen? Der ist für dich richtig."}, {"label": "Durchhalten schlägt Optimieren", "value": "Ein Depot, das du im Crash behältst, ist besser als ein 'optimales', das du panisch auflöst."}], "misconceptions": ["'Die Produktauswahl ist das Wichtigste.' – Nein, die Aufteilung Aktien/sicher zählt weit mehr.", "'Mehr Aktien = immer besser.' – Nur wenn du die Schwankung wirklich aushältst; sonst verkaufst du im Tief.", "'Ich brauche viele verschiedene Bausteine.' – Ein Welt-ETF plus Tagesgeld genügt; Komplexität bringt selten Mehrwert."], "related": ["anleihen-und-tagesgeld", "rebalancing-eigenes-depot", "anlagehorizont", "welt-etf-auswaehlen", "diversifikation-vs-marktrisiko"], "sources": [{"title": "Verbraucherzentrale: Geldanlage – Risiko streuen", "url": "https://www.verbraucherzentrale.de/wissen/geldanlage"}, {"title": "Kommer: Souverän investieren (Asset-Allokation)", "url": "https://gerd-kommer.de/"}]}, {"id": "diversifikation-vs-marktrisiko", "name": "Was Streuung wegnimmt – und was nicht", "aka": ["Diversifikation", "systematisches vs unsystematisches Risiko", "Klumpenrisiko"], "category": "Risiko & Sicherheit", "evidence_level": "A", "tags": ["diversifikation", "risiko", "marktrisiko", "streuung", "korrelation"], "summary": "Streuung über viele Firmen entfernt das Einzelfirmen-Risiko (eine Pleite tut kaum weh) – das ist der ganze Trick eines ETFs. Was Streuung NICHT entfernt, ist das Marktrisiko: Wenn der gesamte Markt fällt (Krise, Rezession, Zinsschock), fällt auch ein breiter ETF. Diese zweite Sorte Risiko lässt sich nur aussitzen, nicht wegdiversifizieren.", "kernidee": "Diversifikation killt das vermeidbare Risiko (einzelne Firma) komplett – aber nicht das unvermeidbare (der ganze Markt).", "deep_dive": "Man unterscheidet zwei Risiko-Arten. Das unsystematische (firmenspezifische) Risiko – schlechtes Management, Skandal, Pleite – lässt sich fast vollständig wegstreuen: Schon ab ~20–30 unterschiedlichen Firmen sinkt es stark, ein Welt-ETF mit >1.000 Firmen macht es praktisch bedeutungslos. Das systematische (Markt-)Risiko dagegen trifft alle gleichzeitig: In 2008 oder im März 2020 fiel fast jede Aktie, weil sich in der Krise die Kurse gemeinsam bewegen (Korrelationen gehen gegen 1). Genau deshalb kann dir ein ETF Drawdowns von −40 bis −55 % bescheren, obwohl er breit gestreut ist. Der einzige bekannte 'Schutz' dagegen ist Zeit (lange Haltedauer, siehe sind-etfs-sicher) und eine Aufteilung über Anlageklassen (z. B. Aktien + Anleihen/Tagesgeld), die sich nicht immer gleich bewegen. Mehr Aktien-ETFs zu kaufen hilft nicht – ein zweiter Welt-ETF streut nichts Neues.", "key_facts": [{"label": "Zwei Risiko-Arten", "value": "Unsystematisch (einzelne Firma) = wegstreubar. Systematisch (ganzer Markt) = bleibt."}, {"label": "Sättigung der Streuung", "value": "Der Großteil des Einzelfirmen-Risikos ist schon bei ~20–30 verschiedenen Firmen weg; darüber sinkt es nur noch langsam.", "source": "Portfoliotheorie (Markowitz/Statman)"}, {"label": "Krisen-Korrelation", "value": "In Crashs fallen fast alle Aktien gemeinsam – Streuung über Aktien allein hilft dann wenig."}, {"label": "Echte Streuung", "value": "Über Anlageklassen (Aktien + Anleihen/Tagesgeld) und Regionen, nicht über zwei ähnliche Aktien-ETFs."}, {"label": "Klumpenrisiko heute", "value": "Im MSCI World stecken ~70 % USA und die größten Tech-Firmen machen einen großen Teil aus – das ist ein realer Konzentrationspunkt, den viele unterschätzen."}], "misconceptions": ["'Mit einem ETF kann ich nichts verlieren.' – Doch: Das Marktrisiko bleibt, −50 % sind historisch möglich.", "'Drei Aktien-ETFs streuen dreimal so gut.' – Meist überlappen sie sich stark; echte Streuung braucht andere Anlageklassen.", "'Diversifikation erhöht die Rendite.' – Sie senkt das Risiko pro Renditeeinheit, sie ist kein Renditeverstärker."], "related": ["marktkapitalisierung-gewichtung", "sind-etfs-sicher", "notgroschen-zuerst"], "sources": [{"title": "Statman: How Many Stocks Make a Diversified Portfolio?", "url": "https://www.jstor.org/stable/2330969"}, {"title": "BaFin: Risiken der Geldanlage", "url": "https://www.bafin.de/DE/Verbraucher/GeldanlageWertpapiere/geldanlage_node.html"}]}, {"id": "entnahmephase", "name": "Die Entnahmephase: wie man später Geld wieder rauszieht", "aka": ["Entsparen", "4-Prozent-Regel", "sichere Entnahmerate", "Sequenzrisiko"], "category": "Depot & Strategie", "evidence_level": "B", "tags": ["entnahme", "entsparen", "4-prozent-regel", "sequenzrisiko", "ruhestand"], "summary": "Irgendwann willst du vom Ersparten leben, nicht nur ansparen. Dann kehrt sich die Logik um: Statt einzuzahlen, entnimmst du regelmäßig. Bekannte Orientierung ist die '4-Prozent-Regel' (jährlich ~4 % des Startvermögens entnehmen). Die größte Gefahr heißt Sequenzrisiko: Ein Crash gleich zu Beginn der Entnahme kann das Vermögen dauerhaft beschädigen.", "kernidee": "Beim Entsparen ist die Reihenfolge der Renditen entscheidend, nicht nur der Durchschnitt. Ein Crash am Anfang tut viel mehr weh als später – dagegen hilft ein Cash-Puffer.", "deep_dive": "Die '4-Prozent-Regel' stammt aus der Trinity-Studie: Wer zu Rentenbeginn 4 % des Depots entnimmt und die Entnahme jährlich an die Inflation anpasst, kam in historischen US-Daten über 30 Jahre meist nicht pleite. Wichtige Einordnung: Das ist eine grobe Orientierung, kein Gesetz – sie beruht auf US-Historie, langen Zeiträumen und bestimmten Aktien/Anleihen-Mischungen; für sehr lange Ruhestände oder andere Länder wird oft eine etwas niedrigere Rate (3,0–3,5 %) genannt. Der zentrale Begriff ist das SEQUENZRISIKO: Nicht nur die Durchschnittsrendite zählt, sondern ihre Reihenfolge. Fällt der Markt gleich in den ersten Entnahmejahren stark, verkaufst du Anteile im Tief, um zu leben – dieses Kapital fehlt dann für die Erholung, und das Depot erholt sich womöglich nie mehr. Fällt derselbe Crash erst spät, ist er meist harmlos. Gegenmittel: (1) Cash-Puffer von 1–3 Jahresausgaben, aus dem du in Crash-Phasen lebst, statt Aktien im Tief zu verkaufen. (2) Flexible Entnahme – in schlechten Jahren weniger entnehmen. (3) In den Jahren vor dem Entnahmestart den sicheren Teil erhöhen (siehe depot-aufteilung-assetallokation). Anders als in der Ansparphase (wo Crashs sogar günstig sind, weil der Sparplan billig kauft) ist Flexibilität hier der Schlüssel. Diese Karte ist eine Orientierung, keine Ruhestandsplanung – bei größeren Summen lohnt individuelle Beratung.", "key_facts": [{"label": "4-Prozent-Regel", "value": "Startentnahme ~4 % des Depots, jährlich an Inflation angepasst; grobe Orientierung aus der Trinity-Studie (US, 30 Jahre).", "source": "Trinity Study 1998"}, {"label": "Eher konservativ", "value": "Für lange Ruhestände/andere Länder werden oft 3,0–3,5 % genannt; 4 % ist keine Garantie."}, {"label": "Sequenzrisiko", "value": "Ein Crash zu BEGINN der Entnahme schadet dauerhaft; derselbe Crash spät ist meist harmlos."}, {"label": "Cash-Puffer", "value": "1–3 Jahresausgaben in Sicherheit, um in Crash-Phasen daraus zu leben statt Aktien im Tief zu verkaufen."}, {"label": "Flexibilität", "value": "In schlechten Börsenjahren weniger entnehmen – der wirksamste Schutz gegen frühes Sequenzrisiko."}], "misconceptions": ["'4 % sind immer sicher.' – Nur eine historische Orientierung; je nach Dauer/Land kann weniger nötig sein.", "'In der Entnahme zählt nur die Durchschnittsrendite.' – Nein, die Reihenfolge (Sequenzrisiko) ist entscheidend.", "'Crashs sind immer schlecht.' – Beim Ansparen sind sie günstig (billiger Kauf); nur beim Entnehmen am Anfang sind sie gefährlich."], "related": ["anlagehorizont", "depot-aufteilung-assetallokation", "anleihen-und-tagesgeld", "sind-etfs-sicher"], "sources": [{"title": "Trinity Study / Bengen: Safe Withdrawal Rates (Überblick)", "url": "https://www.bogleheads.org/wiki/Trinity_study_update"}, {"title": "Early Retirement Now: Safe Withdrawal Rate Series", "url": "https://earlyretirementnow.com/safe-withdrawal-rate-series/"}]}, {"id": "index-aufnahme-und-ausschluss", "name": "Rebalancing: Wann kauft und verkauft ein ETF wirklich?", "aka": ["Index-Review", "Rebalancing", "Aufnahme und Ausschluss"], "category": "ETF-Grundlagen", "evidence_level": "A", "tags": ["rebalancing", "index-review", "verkauf", "aufnahme", "kosten"], "summary": "Ein ETF handelt aktiv nur zu festen Terminen (meist quartalsweise), wenn der Index-Anbieter seine Liste überarbeitet: Firmen, die zu klein/unbedeutend geworden sind, fliegen raus und werden verkauft; neue kommen rein und werden gekauft. Zwischen diesen Terminen passiert die Gewichtung automatisch über die Kurse (siehe marktkapitalisierung-gewichtung).", "kernidee": "Verkauft wird eine abgestürzte Firma erst beim planmäßigen Index-Review – und dann ist ihr Gewicht längst fast null. Der eigentliche Verlust ist da schon 'durch'.", "deep_dive": "Der Index-Anbieter (MSCI, S&P, FTSE) prüft in regelmäßigen Reviews, welche Firmen die Aufnahmekriterien noch erfüllen: Mindest-Börsenwert, Streubesitz (frei handelbarer Anteil), Handelsvolumen, Börsenland. Erfüllt eine Firma sie nicht mehr, wird sie zum Stichtag entfernt – der ETF verkauft dann die letzten (kleinen) Restbestände und kauft dafür den Neuzugang. Weil die abstürzende Firma bis dahin schon fast kein Gewicht mehr hat, kostet dieser Verkauf kaum noch etwas – der Wertverlust ist längst passiert, während der Kurs fiel. Genau deshalb hilft es nichts, auf ein 'rechtzeitiges Verkaufen durch den ETF' zu hoffen: Der Schutz kommt nicht aus dem Timing des Verkaufs, sondern aus der breiten Streuung. Kritische Sonderfälle (Übernahme, Insolvenz, Delisting) werden außerplanmäßig behandelt, damit der ETF sauber weiterläuft.", "key_facts": [{"label": "Termine", "value": "Große Indizes werden meist vierteljährlich überprüft (MSCI: Februar, Mai, August, November), manche jährlich."}, {"label": "Aufnahmekriterien", "value": "Mindest-Börsenwert, Streubesitz, Liquidität/Handelsvolumen, Börsensitz. Fällt eine Firma darunter, wird sie entfernt."}, {"label": "Verkauf = spät und klein", "value": "Beim Rauswurf ist das Gewicht der Firma meist schon winzig – der Verlust ist während des Kursverfalls entstanden, nicht erst beim Verkauf."}, {"label": "Umschichtungskosten", "value": "Häufiges Rebalancing verursacht Handelskosten. Deshalb sind ruhige, breite Indizes (wenig Umschlag) tendenziell günstiger und effizienter."}, {"label": "Sonderfälle", "value": "Übernahmen, Fusionen, Insolvenzen oder Delistings werden außerplanmäßig abgewickelt."}], "misconceptions": ["'Der ETF steigt clever aus, bevor eine Firma abstürzt.' – Nein, er reagiert erst beim planmäßigen Review, wenn das Gewicht schon fast null ist.", "'Rebalancing macht mich reicher, weil billig gekauft/teuer verkauft wird.' – Bei cap-gewichteten Indizes ist Rebalancing überwiegend Wartung, kein Renditemotor; es verursacht sogar Kosten.", "'Ich muss selbst umschichten.' – Nein, das erledigt der ETF automatisch nach der Index-Regel."], "related": ["marktkapitalisierung-gewichtung", "was-ist-ein-etf", "diversifikation-vs-marktrisiko"], "sources": [{"title": "MSCI Index Review Termine & Methodik", "url": "https://www.msci.com/our-solutions/indexes/index-review"}, {"title": "S&P Dow Jones Indices – Methodology", "url": "https://www.spglobal.com/spdji/en/documents/methodologies/"}]}, {"id": "inflation-nominal-vs-real", "name": "Nominal vs. real: Aktien als Sachwert gegen Inflation", "aka": ["Kaufkraft", "Realrendite", "Sachwert vs Geldwert", "Inflationsschutz"], "category": "Wirtschaft & Wachstum", "evidence_level": "A", "tags": ["inflation", "nominal", "real", "kaufkraft", "sachwert", "bargeld"], "summary": "Nominal = in Euro gerechnet. Real = nach Abzug der Inflation, also in Kaufkraft. Nur die reale Rendite macht dich wirklich reicher. Bargeld verliert durch Inflation garantiert an Kaufkraft; eine Aktie ist ein Sachwert, dessen Umsatz und Gewinn bei Inflation nominal mitsteigen – deshalb trägt sie die Inflation durch, statt an ihr zu verlieren.", "kernidee": "Der reine Preisanstieg (Inflation) ist ein Nullsummenspiel. Was zählt, ist der reale Teil obendrauf – und genau den kann ein Sachwert liefern, Bargeld nicht.", "deep_dive": "Beispiel: Ein Sparbuch bringt 2 % 'Zinsen', die Inflation liegt bei 3 %. Nominal wird dein Guthaben größer, real (in Kaufkraft) schrumpft es um ~1 % pro Jahr. Nominal ist also trügerisch. Warum trägt eine Aktie die Inflation durch? Weil eine Firma ein Sachwert ist: Wird alles teurer, erhöht auch sie ihre Preise -> Umsatz und Gewinn in Euro steigen mit -> der Börsenwert in Euro steigt mit. Bargeld kann das nicht, es ist ein reiner Geldwert und verliert. ABER: Wenn eine Aktie NUR die Inflation abbilden würde, wäre sie real bei null – ein teures Sparbuch. Der echte Gewinn ist der REALE Teil obendrauf: reinvestierte Gewinne, Produktivität, Innovation (siehe wirtschaftswachstum-real und warum-aktien-langfristig-steigen). Historisch: breite Weltaktien ~5–7 % real pro Jahr, also nach Abzug der Inflation. Faustregel: Immer real denken. Eine Rendite von 8 % bei 3 % Inflation sind real ~5 %. Und Vorsicht – Inflationsschutz gilt langfristig; kurzfristig können Aktien in Inflationsschocks (steigende Zinsen) sogar erst fallen.", "key_facts": [{"label": "Nominal vs real", "value": "Nominal = in Euro. Real = nach Inflation, in Kaufkraft. Nur real zählt für echten Vermögenszuwachs."}, {"label": "Bargeld verliert garantiert", "value": "Bei 3 % Inflation halbiert sich die Kaufkraft von Bargeld in ~23 Jahren – ganz ohne Crash."}, {"label": "Aktie = Sachwert", "value": "Firmen geben Inflation über höhere Preise weiter; Umsatz/Gewinn/Kurs steigen nominal mit."}, {"label": "Der reale Teil zählt", "value": "Weltaktien historisch ~5–7 % real pro Jahr – das ist der Zuwachs ÜBER die Inflation hinaus.", "source": "Dimson/Marsh/Staunton"}, {"label": "Kurzfrist-Warnung", "value": "In Inflationsschocks mit steigenden Zinsen können Aktien zunächst fallen; der Schutz wirkt langfristig, nicht als Tagesgarantie."}], "misconceptions": ["'Mein Sparbuch wächst, also werde ich reicher.' – Nominal ja, real oft nein, wenn die Inflation höher ist als der Zins.", "'8 % Rendite sind 8 % mehr Wohlstand.' – Nein, bei 3 % Inflation sind es real nur ~5 %.", "'Aktien schützen sofort vor Inflation.' – Langfristig ja, kurzfristig können sie in Zinsschocks erst fallen."], "related": ["wirtschaftswachstum-real", "warum-aktien-langfristig-steigen", "sind-etfs-sicher", "notgroschen-zuerst"], "sources": [{"title": "Bundesbank: Inflation und Kaufkraft (Erklärungen)", "url": "https://www.bundesbank.de/de/aufgaben/preisstabilitaet"}, {"title": "UBS Global Investment Returns Yearbook", "url": "https://www.ubs.com/global/en/investment-bank/in-focus/2023/global-investment-returns-yearbook.html"}]}, {"id": "markt-timing-jetzt-ist-schlecht", "name": "Market-Timing: warum 'jetzt ist gerade schlecht' fast immer falsch ist", "aka": ["Timing", "auf den richtigen Moment warten", "Analyse-Lähmung"], "category": "Psychologie & Verhalten", "evidence_level": "A", "tags": ["market-timing", "psychologie", "einstieg", "warten", "fehler"], "summary": "Der Versuch, den 'richtigen Moment' zum Kaufen zu erwischen, fühlt sich vorsichtig an, ist aber einer der teuersten Anlegerfehler. Es fühlt sich zu JEDER Zeit gerade schlecht an – es gibt immer eine Krise, hohe Bewertungen oder einen drohenden Crash. Weil niemand den Markt zuverlässig timen kann (auch keine Profis), führt Warten meist nur dazu, gar nicht dabei zu sein.", "kernidee": "Es gibt nie den 'sicheren Moment'. Der einzige Fehler, der auf lange Sicht wirklich zählt, ist, gar nicht investiert zu sein.", "deep_dive": "Rückblickend waren 2009, 2012, 2016 und 2020 großartige Einstiegszeitpunkte – aber DAMALS fühlte sich jeder davon gefährlich an (Finanzkrise, Eurokrise, Brexit, Corona). Genau das ist die Falle: Die Gegenwart fühlt sich immer unsicher an, weil die Zukunft unbekannt ist. Wer auf Sicherheit wartet, wartet ewig. Dass Timing nicht funktioniert, ist gut belegt: Selbst professionelle Fonds, die dafür bezahlt und mit Supercomputern ausgestattet sind, schlagen den simplen Markt langfristig mehrheitlich nicht (siehe aktiv-vs-passiv). Wenn die es nicht können, ist 'jetzt ist gerade schlecht' kein Wissen, sondern ein Gefühl. Statistisch schlägt sofortiges Investieren das Warten in rund zwei von drei Fällen, weil Märkte im Mittel steigen und wartendes Geld die Aufwärtsdrift verpasst (siehe sparplan-vs-einmalanlage). Der Ausweg ist nicht 'besser timen', sondern das Timing-Problem abzuschaffen: automatisch per Sparplan kaufen (siehe sparplan-als-automatik) und die Entscheidung der Bank überlassen. Reframe: Du kaufst nicht den Markt von heute, sondern die nächsten 20 Jahre Wirtschaftsleistung – auf dieser Zeitskala ist der genaue Einstiegstag Rauschen.", "key_facts": [{"label": "Es fühlt sich immer schlecht an", "value": "Zu jedem Zeitpunkt gibt es Krisen und Warnungen; die besten Einstiege der Vergangenheit fühlten sich damals gefährlich an."}, {"label": "Timing funktioniert nicht", "value": "Selbst Profifonds schlagen den Markt langfristig mehrheitlich nicht – Timing ist kein zuverlässiges Können.", "source": "S&P SPIVA"}, {"label": "Warten kostet", "value": "Sofort investieren schlug das Warten historisch in ~2 von 3 Fällen.", "source": "Vanguard"}, {"label": "Der teure Fehler", "value": "Nicht der schlechte Einstiegstag ruiniert die Rendite, sondern das Gar-nicht-dabei-Sein."}, {"label": "Lösung", "value": "Nicht besser timen, sondern automatisieren (Sparplan) und den Zeithorizont lang halten."}], "misconceptions": ["'Ich warte auf den Crash und steige dann günstig ein.' – Den Tiefpunkt trifft fast niemand; meist steigt der Markt vorher davon.", "'Vorsichtig warten ist risikoarm.' – Das größte Risiko ist, jahrelang gar nicht investiert zu sein.", "'Hohe Kurse heißt, jetzt ist ein schlechter Zeitpunkt.' – Märkte stehen die meiste Zeit nahe Höchstständen, weil sie langfristig steigen."], "related": ["time-in-the-market", "sparplan-als-automatik", "sparplan-vs-einmalanlage", "aktiv-vs-passiv", "anlegerfehler-uebersicht"], "sources": [{"title": "Vanguard: Cost averaging vs lump-sum investing", "url": "https://corporate.vanguard.com/content/dam/corp/research/pdf/cost_averaging_invest_now_or_temporarily_hold_your_cash.pdf"}, {"title": "S&P SPIVA Scorecards", "url": "https://www.spglobal.com/spdji/en/research-insights/spiva/"}]}, {"id": "marktkapitalisierung-gewichtung", "name": "Wie ein ETF gewichtet – und warum Verlierer von selbst verschwinden", "aka": ["Marktkapitalisierung", "Cap-weighted", "Selbstreinigung des Index"], "category": "ETF-Grundlagen", "evidence_level": "A", "tags": ["gewichtung", "marktkapitalisierung", "rebalancing", "nokia", "risiko"], "summary": "Ein normaler Index-ETF gewichtet jede Firma nach ihrem Börsenwert (Kurs × Anzahl Aktien), NICHT nach Umsatz oder Gewinn. Das hat eine wichtige Folge: Wenn eine Firma abstürzt, schrumpft ihr Anteil im ETF ganz von selbst mit – der ETF muss nichts aktiv verkaufen, um sie kleiner zu machen. Große Gewinner wachsen automatisch, Verlierer verhungern automatisch.", "kernidee": "Der Kurs steuert das Gewicht automatisch. Eine abstürzende Firma wird nicht 'verkauft' – ihr Anteil sinkt einfach mit dem Kurs Richtung null.", "deep_dive": "Beispiel Nokia: Um 2000 war Nokia die wertvollste Firma Europas und machte mehrere Prozent eines Europa-Index aus. Als das Smartphone-Geschäft einbrach, fiel der Kurs – und damit sank Nokias Anteil im Index automatisch: von ~4 % auf 2 %, auf 0,3 %, auf fast null. Niemand musste eine Entscheidung treffen. Der Verlust wurde dabei NICHT weggezaubert: Wer den Index hielt, hat den Absturz mitgemacht – aber immer nur mit dem Anteil, den Nokia gerade noch hatte. Genau das ist der Schutz: In einem MSCI World mit ~1.500 Firmen ist keine einzelne Firma groß genug, um dich ernsthaft zu ruinieren. Wichtig zur Einordnung: Der Index schaut NICHT auf Umsatz oder Gewinn. Eine Firma mit Rekordumsatz, deren Aktie aber fällt, bekommt automatisch weniger Gewicht – weil nur der Börsenwert zählt. Umgekehrt wächst ein neuer Star (z. B. Nvidia) automatisch in den Index hinein, während er steigt.", "key_facts": [{"label": "Gewicht = Börsenwert", "value": "Anteil einer Firma = ihr Börsenwert ÷ Summe aller Börsenwerte im Index. Kurs runter → Anteil runter, ganz ohne Eingriff."}, {"label": "Umsatz zählt NICHT", "value": "Ein cap-gewichteter Index bewertet nach Marktpreis, nicht nach Fundamentaldaten wie Umsatz oder Gewinn. Der Markt 'stimmt' über den Kurs ab."}, {"label": "Automatische Selbstreinigung", "value": "Verlierer schrumpfen von selbst gegen null; Gewinner wachsen von selbst. Der ETF folgt nur der Gewichtung."}, {"label": "Kein Rundum-Schutz", "value": "Der Verlust einer fallenden Firma wird mitgetragen – aber nur anteilig. Bei breiter Streuung ist der Einzelbeitrag klein."}, {"label": "Nokia-Detail", "value": "Nokia ist finnisch und war in Europa-/Welt-Indizes, nicht im US-S&P 100. Das Prinzip ist überall gleich (vgl. Enron, Lehman, Wirecard)."}], "misconceptions": ["'Der ETF verkauft eine abstürzende Firma sofort, um mich zu schützen.' – Nein, der Anteil schrumpft passiv mit dem Kurs; verkauft wird erst beim Rausschmiss aus dem Index (siehe index-aufnahme-und-ausschluss).", "'Firmen mit hohem Umsatz sind im ETF stärker gewichtet.' – Nein, nur der Börsenwert zählt.", "'Eine Pleite kann meinen ETF ruinieren.' – Bei breiter Streuung trägt eine einzelne Firma nur wenige Prozent oder Bruchteile davon."], "related": ["was-ist-ein-etf", "index-aufnahme-und-ausschluss", "diversifikation-vs-marktrisiko"], "sources": [{"title": "MSCI: Index-Methodik (Marktkapitalisierungs-Gewichtung)", "url": "https://www.msci.com/index-methodology"}, {"title": "S&P Dow Jones: Float-Adjusted Market Cap Weighting", "url": "https://www.spglobal.com/spdji/en/education/"}]}, {"id": "notgroschen-zuerst", "name": "Notgroschen zuerst – bevor du investierst", "aka": ["Notreserve", "Emergency Fund", "Liquiditätspuffer"], "category": "Praxis / Erste Schritte", "evidence_level": "A", "tags": ["notgroschen", "sicherheit", "tagesgeld", "erste-schritte", "liquiditaet"], "summary": "Bevor Geld in einen ETF geht, gehört ein Notgroschen auf ein sicheres, jederzeit verfügbares Konto (Tagesgeld). Grund: Ein ETF kann genau dann tief im Minus stehen, wenn du das Geld dringend brauchst (Jobverlust, Reparatur). Der Notgroschen sorgt dafür, dass du nie im ungünstigsten Moment mit Verlust verkaufen musst.", "kernidee": "Erst der Puffer, dann die Rendite. Der Notgroschen ist das, was dir erlaubt, den ETF in Ruhe liegen zu lassen und Krisen auszusitzen.", "deep_dive": "Der häufigste Grund, warum Menschen mit ETFs Geld verlieren, ist erzwungenes Verkaufen im Tief. Wer keinen Puffer hat, muss bei einer unerwarteten Ausgabe genau dann Anteile verkaufen, wenn der Markt vielleicht gerade −40 % steht – der Papierverlust wird real. Ein Notgroschen von etwa 3–6 Monatsausgaben (bei unsicherem Einkommen mehr) auf Tagesgeld löst das: kein Kursrisiko, in ein bis zwei Tagen verfügbar, durch die gesetzliche Einlagensicherung bis 100.000 € je Bank/Kunde geschützt. Dieses Geld ist bewusst NICHT für Rendite da, sondern für Ruhe. Erst was darüber hinaus geht und was du 10+ Jahre nicht brauchst, ist Kandidat für einen ETF.", "key_facts": [{"label": "Höhe", "value": "Grob 3–6 Monatsausgaben; bei schwankendem/unsicherem Einkommen eher 6–12."}, {"label": "Wohin", "value": "Tagesgeld oder Festgeld mit kurzer Laufzeit – kein Kursrisiko, schnell verfügbar."}, {"label": "Einlagensicherung", "value": "In der EU gesetzlich bis 100.000 € je Kunde und Bank geschützt.", "source": "EU-Einlagensicherungsrichtlinie"}, {"label": "Zweck", "value": "Nicht Rendite, sondern die Freiheit, den ETF NIE im Tief verkaufen zu müssen."}, {"label": "Reihenfolge", "value": "1) teure Schulden tilgen 2) Notgroschen aufbauen 3) erst dann breit investieren."}], "misconceptions": ["'Tagesgeld ist Geldverschwendung, alles gehört in den ETF.' – Ohne Puffer wirst du irgendwann im Tief zum Verkauf gezwungen.", "'Der Notgroschen soll auch Rendite bringen.' – Nein, seine Aufgabe ist Sicherheit und Verfügbarkeit."], "related": ["sind-etfs-sicher", "sparplan-vs-einmalanlage", "welt-etf-auswaehlen"], "sources": [{"title": "Verbraucherzentrale: Notreserve / Geldanlage-Grundlagen", "url": "https://www.verbraucherzentrale.de/wissen/geldanlage"}, {"title": "BaFin: Einlagensicherung", "url": "https://www.bafin.de/DE/Verbraucher/Bank/Einlagensicherung/einlagensicherung_node.html"}]}, {"id": "rebalancing-eigenes-depot", "name": "Das eigene Depot rebalancieren", "aka": ["Rebalancing", "Wiederherstellen der Zielaufteilung", "Umschichten"], "category": "Depot & Strategie", "evidence_level": "B", "tags": ["rebalancing", "assetallokation", "risiko", "disziplin", "steuern"], "summary": "Rebalancing heißt: die ursprünglich gewählte Aufteilung (z. B. 70 % Aktien / 30 % sicher) regelmäßig wiederherstellen. Weil Aktien meist stärker steigen, wächst ihr Anteil mit der Zeit über das Ziel – und dein Depot wird riskanter, als du wolltest. Rebalancing bringt es zurück und ist vor allem ein Risiko-Werkzeug, kein Rendite-Trick.", "kernidee": "Nicht das Depot verkauft automatisch (das war der ETF) – DU stellst deine gewählte Aktien/sicher-Mischung wieder her, damit das Risiko nicht davonläuft.", "deep_dive": "Wichtig zur Abgrenzung: Der ETF gewichtet seine Firmen intern automatisch (siehe marktkapitalisierung-gewichtung). Beim Rebalancing geht es dagegen um DEINE Aufteilung zwischen den Töpfen Aktien und sicher (siehe depot-aufteilung-assetallokation). Beispiel: Du startest 70/30. Nach einer guten Börsenphase stehst du bei 80/20 – dein Depot ist jetzt riskanter, als du eingestellt hattest. Beim Rebalancing bringst du es zurück auf 70/30. Zwei gängige Methoden: (1) Kalender – z. B. einmal im Jahr prüfen und anpassen. (2) Schwelle – nur eingreifen, wenn ein Topf mehr als z. B. 5 Prozentpunkte vom Ziel abweicht. Beides ist okay; einmal jährlich ist für die meisten ausreichend. Der steuer- und kostenschonendste Weg ist, NICHT zu verkaufen, sondern mit frischem Geld (Sparplanraten, Zuflüsse) gezielt den zu kleinen Topf aufzufüllen – so vermeidest du Verkaufsgewinne, die in Deutschland Abgeltungsteuer auslösen (siehe vorabpauschale-steuern-de). Effekt: Rebalancing hält dein Risiko konstant und erzwingt antizyklisches Verhalten (du verkaufst tendenziell das Teure, kaufst das Billige) – der Renditebeitrag ist aber meist klein; der Hauptnutzen ist Risikokontrolle und Disziplin.", "key_facts": [{"label": "Was", "value": "Deine Aktien/sicher-Zielmischung wiederherstellen, wenn sie verrutscht ist."}, {"label": "Warum", "value": "Aktien steigen meist stärker → ihr Anteil wächst über das Ziel → Depot wird ungewollt riskanter."}, {"label": "Wie oft", "value": "Kalender (z. B. 1×/Jahr) oder Schwelle (z. B. bei >5 Prozentpunkten Abweichung). Einmal jährlich reicht meist."}, {"label": "Steuerschonend", "value": "Statt zu verkaufen mit frischem Geld den zu kleinen Topf auffüllen – vermeidet steuerpflichtige Verkaufsgewinne."}, {"label": "Nutzen", "value": "Vor allem Risikokontrolle + Disziplin (antizyklisch); der Renditebeitrag ist meist gering."}], "misconceptions": ["'Rebalancing steigert die Rendite deutlich.' – Der Hauptnutzen ist Risikokontrolle; der Renditeeffekt ist meist klein.", "'Ich muss ständig umschichten.' – Einmal im Jahr oder bei größerer Abweichung genügt.", "'Rebalancing heißt immer verkaufen.' – Besser: mit neuen Einzahlungen auffüllen, um Steuern/Kosten zu sparen."], "related": ["depot-aufteilung-assetallokation", "anleihen-und-tagesgeld", "vorabpauschale-steuern-de", "marktkapitalisierung-gewichtung"], "sources": [{"title": "Vanguard: Rebalancing – Prinzipien", "url": "https://corporate.vanguard.com/content/dam/corp/research/pdf/BestPracticesForPortfolioRebalancing.pdf"}]}, {"id": "rechenbeispiel-etf-verlust", "name": "Rechenbeispiel: Firma stürzt ab – wie viel verliert der ETF?", "aka": ["Nokia-Rechnung", "Gewicht schrumpft ohne Verkauf", "Zahlenbeispiel"], "category": "ETF-Grundlagen", "evidence_level": "A", "tags": ["rechenbeispiel", "verlust", "gewichtung", "nokia", "sektor", "zahlen"], "summary": "Konkrete Zahlen zu zwei Effekten, die oft verwechselt werden: (1) Wenn eine Firma abstürzt, verlierst du nur ihren Anteil am ETF – nicht alles. (2) Der Anteil einer Firma kann relativ schrumpfen, OHNE dass etwas verkauft wird, nur weil andere im Kurs steigen.", "kernidee": "Dein Verlust = nur der Anteil, den die Firma bei dir hatte. Und Anteile schrumpfen meist rein rechnerisch über den Kurs, nicht durch Verkauf.", "deep_dive": "BEISPIEL 1 – Absturz einer Firma. Mini-Index aus 5 Firmen, je 200 €, Gesamtwert 1.000 €; Nokia = 20 % Anteil. Nokia stürzt um 90 % ab (200 € -> 20 €). Der Index rechnet sich automatisch neu: Gesamtwert 820 €, Nokia jetzt nur noch 20/820 = 2,4 %. Dein Verlust: Der Nokia-Teil fiel von 200 € auf 20 € = -180 €. Der Rest (800 €) ist unberührt. ETF: 1.000 € -> 820 € = -18 %. Nokia machte -90 %, dein ETF nur -18 % – weil Nokia ein Fünftel war. In einem echten MSCI World mit ~1.500 Firmen wäre so eine Firma vielleicht 0,3 % groß: Pleite = -0,3 %, kaum spürbar. BEISPIEL 2 – schrumpfen ohne verkaufen. Index aus 2 Sektoren, je 500 €. Tech verdreifacht sich (500 € -> 1.500 €), Öl bleibt bei 500 €. Neuer Gesamtwert 2.000 €: Öl jetzt 500/2.000 = 25 % (vorher 50 %), Tech 75 %. Öl ist immer noch 500 € wert – kein Euro verkauft – aber sein Anteil halbierte sich, nur weil Tech stieg. Genau so wurden alte Ölwerte im Index über die Jahrzehnte 'kleiner': nicht rausgeworfen, sondern relativ überholt.", "key_facts": [{"label": "Verlust = Anteil × Kursverfall", "value": "Bei 20 % Gewicht und -90 % Kurs: -18 % im ETF. Bei 0,3 % Gewicht und -100 %: -0,3 %."}, {"label": "Schrumpfen ohne Verkauf", "value": "Öl 500 € bleibt 500 €, fällt aber von 50 % auf 25 % Anteil – allein weil Tech stieg. Keine Transaktion nötig."}, {"label": "Automatische Neurechnung", "value": "Anteil = Firmenwert ÷ Summe aller Werte. Ändert sich ein Kurs, ändern sich alle Anteile von selbst."}, {"label": "Breite = Schutz", "value": "Je mehr Firmen, desto kleiner jeder Einzelanteil – desto weniger tut eine Pleite weh."}], "misconceptions": ["'Wenn eine Firma -90 % macht, verliere ich -90 %.' – Nein, nur anteilig (im Beispiel -18 %, real oft Bruchteile eines Prozents).", "'Öl wurde verkauft, um Tech zu kaufen.' – Nein, Öls Anteil sank, weil Techs KURS stieg; verkauft wird nur beim Index-Rauswurf.", "'Ein steigender Sektor bedeutet, der ETF kauft dort nach.' – Das Gewicht steigt automatisch über den Kurs, ohne Nachkauf."], "related": ["marktkapitalisierung-gewichtung", "index-aufnahme-und-ausschluss", "verkauft-ein-etf-aktien", "diversifikation-vs-marktrisiko"], "sources": [{"title": "MSCI: Index-Methodik (Marktkapitalisierungs-Gewichtung)", "url": "https://www.msci.com/index-methodology"}]}, {"id": "sind-etfs-sicher", "name": "Sind ETFs langfristig 'mathematisch sicher'?", "aka": ["Renditedreieck", "langfristige Sicherheit", "Drawdown", "Aussitzen"], "category": "Risiko & Sicherheit", "evidence_level": "A", "tags": ["sicherheit", "langfristig", "renditedreieck", "drawdown", "japan", "geduld"], "summary": "Ehrliche Antwort: Nein, garantiert sicher sind ETFs nicht – aber breit gestreute Aktien-ETFs sind historisch die robusteste Form, langfristig real (nach Inflation) zu wachsen. Über sehr lange Zeiträume (15+ Jahre) hat ein breiter Welt-Index bisher immer Gewinn gemacht; auf kurze Sicht sind zwischenzeitliche Verluste von −40 bis −55 % völlig normal.", "kernidee": "Nicht 'sicher wie ein Sparbuch', sondern 'sehr wahrscheinlich lohnend, WENN du lange genug (10–15+ Jahre) durchhältst'. Zeit ist der eigentliche Sicherheitsfaktor.", "deep_dive": "Das 'Renditedreieck' des Deutschen Aktieninstituts zeigt für breite Indizes: Je länger die Haltedauer, desto seltener und kleiner die Verlustfälle. Für einen weltweit gestreuten Aktienindex gab es historisch keinen 15-Jahres-Zeitraum mit Verlust. Aber 'historisch' ist keine Garantie – und es gibt Warnbeispiele: Der japanische Nikkei erreichte sein Hoch von Ende 1989 erst wieder um 2024, also nach ~34 Jahren. Ein einzelnes Land kann also sehr lange am Boden liegen – genau deshalb streut man weltweit statt auf ein Land. Zwei Dinge machen das Risiko real: (1) Drawdowns – zwischenzeitliche Rückgänge von 40–55 % kamen mehrfach vor (2000, 2008, 2020) und fühlen sich schrecklich an; wer da panisch verkauft, macht den Verlust echt. (2) Sequenzrisiko – wann genau die Krise fällt, ist bei kurzem Horizont entscheidend. Fazit: 'Mathematisch sicher' im Sinne einer Garantie gibt es nicht. Was es gibt, ist eine sehr robuste Kombination: breit + billig + langfristig + Geld, das du nicht anfassen musst. Das ist der beste allgemein bekannte Kompromiss aus Rendite und Risiko.", "key_facts": [{"label": "Lange Haltedauer", "value": "Für einen breiten Welt-Aktienindex gab es historisch keinen 15-Jahres-Zeitraum mit Verlust – auf 1–5 Jahre sehr wohl.", "source": "Renditedreieck / MSCI-World-Historie"}, {"label": "Normale Drawdowns", "value": "Rückgänge von −40 bis −55 % traten mehrfach auf (2000–2003, 2007–2009, 2020) und erholten sich danach."}, {"label": "Langes-Leiden-Beispiel", "value": "Nikkei 225 (Japan): Hoch Ende 1989 erst um 2024 wieder erreicht – ein Grund, weltweit statt auf ein Land zu setzen."}, {"label": "Reale Rendite", "value": "Weltaktien lieferten langfristig grob ~5–7 % pro Jahr real (nach Inflation) – im Schnitt, nicht garantiert und nicht gleichmäßig.", "source": "Dimson/Marsh/Staunton, Credit Suisse/UBS Yearbook"}, {"label": "Das echte Risiko bist oft du", "value": "Der größte Renditeverlust entsteht durch Panikverkäufe im Tief und Nicht-durchhalten – nicht durch den Markt selbst."}], "misconceptions": ["'ETFs sind so sicher wie Tagesgeld.' – Nein, sie schwanken stark; das Sicherheitsgefühl kommt erst über lange Zeit.", "'Wenn ich breit streue, kann ich nie verlieren.' – Das Marktrisiko bleibt; kurzfristig sind hohe Verluste möglich.", "'Vergangene Rendite garantiert die Zukunft.' – Nein. Japan zeigt, dass Jahrzehnte Stillstand möglich sind – deshalb weltweit streuen."], "related": ["diversifikation-vs-marktrisiko", "sparplan-vs-einmalanlage", "notgroschen-zuerst"], "sources": [{"title": "Deutsches Aktieninstitut – Renditedreieck", "url": "https://www.dai.de/rendite-dreieck/"}, {"title": "UBS Global Investment Returns Yearbook (Dimson/Marsh/Staunton)", "url": "https://www.ubs.com/global/en/investment-bank/in-focus/2023/global-investment-returns-yearbook.html"}]}, {"id": "sparplan-als-automatik", "name": "Der Sparplan als Automatik gegen die eigene Psyche", "aka": ["Dauerauftrag ins Depot", "automatisch investieren", "Set and forget"], "category": "Psychologie & Verhalten", "evidence_level": "A", "tags": ["sparplan", "automatik", "disziplin", "psychologie", "einstieg"], "summary": "Wenn dein Problem ist, dass du nie 'abdrückst' (immer denkst 'jetzt ist gerade schlecht'), ist die Lösung nicht besseres Timing, sondern das Abschaffen der Entscheidung: ein automatischer ETF-Sparplan kauft jeden Monat einen festen Betrag – ohne dass du zustimmen musst. Damit wird deine Schwäche schlicht irrelevant.", "kernidee": "Nimm dir die Entscheidung aus der Hand. Ein Sparplan kauft stur weiter, egal wie die Nachrichten sind – so bleibst du automatisch dabei.", "deep_dive": "Der häufigste Grund, warum Menschen trotz Wissen nicht investieren, ist der 'Abzug': die einzelne Kaufentscheidung, die sich immer riskant anfühlt. Ein Sparplan löst genau das. Du legst einmal fest: Betrag (z. B. 100–500 € im Monat), ETF (breiter Welt-ETF, siehe welt-etf-auswaehlen) und Ausführungstag. Ab dann kauft die Bank automatisch – ob Crash oder Rekordhoch, ohne Rückfrage. Vorteile: (1) Du bist immer investiert und verpasst die guten Tage nicht (siehe time-in-the-market). (2) Du kaufst mal teurer, mal billiger; der Einstiegskurs mittelt sich, und die Reue 'ich hab am Hoch gekauft' verschwindet (Durchschnittskosteneffekt, siehe sparplan-vs-einmalanlage). (3) Es entkoppelt Sparen vom Gefühl – du musst nie wieder 'jetzt?' denken. Viele Broker führen Sparpläne auf gängige ETFs kostenlos aus. Praktischer Tipp: Ausführung kurz nach dem Gehaltseingang legen ('erst investieren, dann leben'). Wer eine große Summe herumliegen hat, kann kombinieren: einen Teil sofort investieren, den Rest über 6–12 Monate per Sparplan einstreuen. Wichtig: Sparplan einmal einrichten und dann NICHT ständig anfassen oder pausieren, wenn es kriselt – das Nicht-Eingreifen ist der ganze Trick.", "key_facts": [{"label": "Prinzip", "value": "Fester Betrag, fester ETF, fester Tag – die Bank kauft automatisch, ohne dass du entscheiden musst."}, {"label": "Löst dein Problem", "value": "Der 'Abzug' entfällt: Nie-Kaufen wird irrelevant, weil die Automatik für dich kauft."}, {"label": "Kosten", "value": "Bei vielen Brokern kostenlos auf gängige Welt-ETFs."}, {"label": "Timing der Ausführung", "value": "Kurz nach Gehaltseingang – erst investieren, dann leben ('pay yourself first')."}, {"label": "Regel Nr. 1", "value": "Einrichten und in Ruhe lassen – gerade in Krisen NICHT pausieren, sonst verpasst du die günstigen Käufe."}], "misconceptions": ["'Ich fange an, wenn die Lage besser ist.' – Genau das verhindert den Start für immer; die Automatik umgeht es.", "'In der Krise pausiere ich den Sparplan.' – Dann kaufst du gerade dann NICHT, wenn es billig ist – der teuerste Reflex.", "'Sparplan bringt mehr Rendite als Einmalanlage.' – Nein, er senkt Risiko/Reue und sorgt vor allem dafür, dass du überhaupt dabei bist."], "related": ["markt-timing-jetzt-ist-schlecht", "time-in-the-market", "sparplan-vs-einmalanlage", "welt-etf-auswaehlen", "broker-depot-auswahl"], "sources": [{"title": "Verbraucherzentrale: Mit ETF-Sparplänen Vermögen aufbauen", "url": "https://www.verbraucherzentrale.de/wissen/geldanlage/etf"}]}, {"id": "sparplan-vs-einmalanlage", "name": "Einmal alles anlegen oder gestückelt (Sparplan)?", "aka": ["Lump Sum vs Cost Averaging", "Sparplan", "Durchschnittskosteneffekt"], "category": "Praxis / Erste Schritte", "evidence_level": "B", "tags": ["sparplan", "einmalanlage", "cost-averaging", "psychologie", "timing"], "summary": "Du hast Geld, das lange herumliegt, und fragst dich: alles auf einmal investieren oder über Monate verteilen? Statistisch gewinnt meistens die Einmalanlage, weil Märkte im Schnitt steigen und wartendes Geld Rendite verpasst. Psychologisch ist das gestückelte Einsteigen (z. B. über 6–12 Monate) oft leichter durchzuhalten und schützt vor dem Gefühl, 'genau am Hoch' eingestiegen zu sein.", "kernidee": "Mathe favorisiert leicht die Einmalanlage; Nerven favorisieren das Verteilen. Beide sind vernünftig – Hauptsache, du bleibst dabei.", "deep_dive": "Vanguard und andere haben gezeigt: In der Mehrzahl der historischen Zeiträume (~zwei Drittel) hätte eine sofortige Einmalanlage besser abgeschnitten als gestückeltes Einzahlen – schlicht, weil Aktienmärkte im langfristigen Mittel steigen und jeder Monat 'draußen' im Schnitt Rendite kostet. Der Durchschnittskosteneffekt ('Cost Averaging') ist also KEIN Renditetrick, sondern ein Risiko- und Psychologie-Werkzeug: Er glättet den Einstiegskurs und senkt die Reue, falls kurz nach dem Einstieg ein Crash kommt. Für eine große Summe, die dich nervös macht, ist ein Kompromiss üblich und sinnvoll: einen Teil sofort investieren, den Rest über z. B. 6–12 Monate automatisiert einzahlen. Wichtig: Das ist kein Markt-Timing – du versuchst nicht, den Tiefpunkt zu erraten, sondern nimmst dir nur die Angst vor dem einen falschen Tag. Wer ohnehin monatlich aus dem Einkommen spart, macht sowieso automatisch einen Sparplan.", "key_facts": [{"label": "Statistik", "value": "Einmalanlage schlug gestückeltes Einzahlen historisch in ~2 von 3 Fällen.", "source": "Vanguard: Dollar-Cost Averaging vs Lump Sum"}, {"label": "Warum", "value": "Märkte steigen im langen Mittel; wartendes Geld verpasst diese Aufwärtsdrift."}, {"label": "Cost Averaging ist Psychologie", "value": "Kein Rendite-Trick, sondern Schutz vor Einstiegs-Reue und ein Weg, überhaupt anzufangen."}, {"label": "Praktischer Kompromiss", "value": "Große Summe: z. B. ein Drittel bis Hälfte sofort, Rest automatisiert über 6–12 Monate."}, {"label": "Kein Timing", "value": "Nicht auf den 'richtigen Moment' warten – Zeit im Markt schlägt Timing des Marktes."}], "misconceptions": ["'Sparplan bringt durch den Durchschnittskosteneffekt mehr Rendite.' – Nein, er senkt vor allem Risiko und Reue.", "'Ich warte auf den Crash und steige dann ein.' – Warten kostet im Schnitt Rendite; den Tiefpunkt trifft fast niemand.", "'Alles auf einmal ist immer klüger.' – Statistisch meist, aber wenn dich das lähmt, ist Stückeln besser als gar nicht."], "related": ["sind-etfs-sicher", "notgroschen-zuerst", "welt-etf-auswaehlen"], "sources": [{"title": "Vanguard: Cost averaging vs lump-sum investing", "url": "https://corporate.vanguard.com/content/dam/corp/research/pdf/cost_averaging_invest_now_or_temporarily_hold_your_cash.pdf"}]}, {"id": "ter-und-kosten", "name": "Kosten: TER, Spread & warum billig langfristig gewinnt", "aka": ["Total Expense Ratio", "laufende Kosten", "Spread", "Tracking Difference"], "category": "Kosten", "evidence_level": "A", "tags": ["ter", "kosten", "gebuehren", "spread", "tracking-difference"], "summary": "Kosten sind das Einzige an der Geldanlage, das du sicher kontrollieren kannst – die Rendite nicht. Die wichtigste Zahl ist die TER (Gesamtkostenquote, laufende Fondskosten pro Jahr). Bei breiten ETFs liegt sie bei 0,1–0,25 %. Klingt winzig, macht aber über Jahrzehnte durch den Zinseszins einen großen Unterschied gegenüber aktiven Fonds (~1,5 %).", "kernidee": "Rendite ist ungewiss, Kosten sind sicher. Jeder gesparte Prozentpunkt Gebühr landet direkt in deiner Rendite.", "deep_dive": "Die TER wird laufend intern vom Fondsvermögen abgezogen – du siehst sie nicht als Rechnung, sie steckt schon im Kurs. Über 30 Jahre frisst 1 % mehr Gebühr grob 20–25 % des Endvermögens weg, weil die Kosten jedes Jahr auch auf den entgangenen Zinseszins wirken. Genau das ist der Hauptgrund, warum die meisten aktiven Fonds nach Kosten schlechter abschneiden als ein billiger Index-ETF: Sie müssten ihre höheren Gebühren erst durch Können wieder hereinholen, was langfristig kaum einem gelingt (siehe aktiv-vs-passiv). Neben der TER gibt es zwei weitere Kostenquellen: den Spread (Differenz zwischen Kauf- und Verkaufskurs, klein bei großen liquiden ETFs) und Ordergebühren des Brokers (viele bieten kostenlose Sparpläne). Ein oft besseres Maß als die TER ist die 'Tracking Difference' – wie weit der ETF tatsächlich hinter seinem Index zurückblieb; sie enthält alle realen Kosten und manchmal sogar Zusatzerträge (z. B. aus Wertpapierleihe).", "key_facts": [{"label": "TER breiter ETFs", "value": "0,10–0,25 % pro Jahr; aktive Aktienfonds oft ~1,5 %.", "source": "Anbieter-Factsheets"}, {"label": "Zinseszins-Effekt", "value": "Über ~30 Jahre kann 1 % mehr Gebühr grob 20–25 % weniger Endvermögen bedeuten."}, {"label": "Spread", "value": "Kauf-/Verkaufsdifferenz; bei großen, liquiden Welt-ETFs sehr klein – am größten außerhalb der Haupthandelszeiten."}, {"label": "Ordergebühr", "value": "Broker-abhängig; viele bieten kostenlose Sparpläne auf gängige ETFs."}, {"label": "Tracking Difference", "value": "Aussagekräftiger als TER: die reale Abweichung vom Index über ein Jahr, inkl. aller Effekte."}], "misconceptions": ["'0,2 % gegen 1,5 % ist doch egal.' – Über Jahrzehnte ist das ein großer Unterschied im Endvermögen.", "'Teurer aktiver Fonds = bessere Leistung.' – Meist umgekehrt: Nach Kosten verliert die Mehrheit gegen den Index.", "'Die TER ist eine Rechnung, die ich zahle.' – Nein, sie wird laufend intern abgezogen und steckt schon im Kurs."], "related": ["was-ist-ein-etf", "aktiv-vs-passiv", "welt-etf-auswaehlen"], "sources": [{"title": "SPIVA – Aktive Fonds vs Index (S&P)", "url": "https://www.spglobal.com/spdji/en/research-insights/spiva/"}, {"title": "Verbraucherzentrale: ETF-Kosten", "url": "https://www.verbraucherzentrale.de/wissen/geldanlage/etf"}]}, {"id": "thesaurierend-vs-ausschuettend", "name": "Thesaurierend vs. ausschüttend", "aka": ["Accumulating vs Distributing", "Acc vs Dist", "Dividenden-Wiederanlage"], "category": "ETF-Grundlagen", "evidence_level": "A", "tags": ["thesaurierend", "ausschuettend", "dividenden", "zinseszins", "acc", "dist"], "summary": "ETFs gibt es in zwei Varianten. Thesaurierend (acc): Dividenden werden automatisch im Fonds wieder angelegt – der Anteilswert wächst, du bekommst nichts ausgezahlt. Ausschüttend (dist): Dividenden werden dir aufs Konto überwiesen. Fürs langfristige Vermögensaufbauen ist thesaurierend meist bequemer (automatischer Zinseszins, kein Wiederanlegen nötig).", "kernidee": "Gleicher Index, nur was mit den Dividenden passiert, unterscheidet sich: automatisch reinvestiert (acc) oder ausgezahlt (dist).", "deep_dive": "Beide Varianten bilden denselben Index ab, die Rendite vor Steuern ist praktisch gleich. Der Unterschied ist der Umgang mit Dividenden. Thesaurierend legt sie sofort und kostenlos wieder an – das ist der Zinseszinseffekt auf Autopilot und ideal, wenn du in der Ansparphase bist und das Geld nicht brauchst. Ausschüttend zahlt sie aus – praktisch, wenn du später ein regelmäßiges Einkommen aus dem Depot ziehen willst, oder um in Deutschland gezielt den jährlichen Sparerpauschbetrag (1.000 €/Person steuerfrei) auszunutzen. Steuerlich (DE) gibt es seit 2018 kaum noch einen Nachteil für thesaurierende Fonds, weil die Vorabpauschale dafür sorgt, dass auch nicht ausgezahlte Erträge laufend versteuert werden (siehe vorabpauschale-steuern-de). Für die meisten in der Aufbauphase ist thesaurierend die einfachste Wahl.", "key_facts": [{"label": "Thesaurierend (acc)", "value": "Dividenden werden automatisch im Fonds reinvestiert; Anteilswert steigt, keine Auszahlung. Bequem fürs Ansparen."}, {"label": "Ausschüttend (dist)", "value": "Dividenden landen auf deinem Konto. Gut für regelmäßiges Einkommen oder zum Ausnutzen des Sparerpauschbetrags."}, {"label": "Rendite gleich", "value": "Vor Steuern liefern beide dasselbe – solange bei 'dist' die Ausschüttungen wieder angelegt werden."}, {"label": "Steuer DE", "value": "Seit 2018 kein echter Steuernachteil für acc: die Vorabpauschale besteuert laufend auch nicht ausgezahlte Erträge."}, {"label": "Erkennung", "value": "Im Namen oft 'Acc'/'(C)' vs 'Dist'/'(D)'; steht auch im Factsheet."}], "misconceptions": ["'Ausschüttend bringt mehr, weil ich Dividenden bekomme.' – Nein, bei 'acc' stecken sie im höheren Kurs; Gesamtrendite ist gleich.", "'Thesaurierend spare ich Steuern.' – In DE seit 2018 nicht mehr wesentlich (Vorabpauschale).", "'Dividenden sind Extra-Gewinn.' – Der Kurs sinkt am Ausschüttungstag um die Dividende; es ist keine geschenkte Rendite."], "related": ["was-ist-ein-etf", "vorabpauschale-steuern-de", "ter-und-kosten"], "sources": [{"title": "Verbraucherzentrale: ETF – ausschüttend oder thesaurierend", "url": "https://www.verbraucherzentrale.de/wissen/geldanlage/etf"}]}, {"id": "time-in-the-market", "name": "Time in the market > timing: die besten Tage & der schlechteste Timer", "aka": ["Zeit im Markt", "beste Tage verpassen", "Bob the worst market timer"], "category": "Psychologie & Verhalten", "evidence_level": "B", "tags": ["dabeibleiben", "beste-tage", "erholung", "panikverkauf", "psychologie"], "summary": "Die stärksten Börsentage kommen fast immer direkt nach den schlimmsten – mitten in der Panik, wenn die meisten draußen sind. Wer aus Angst raus- und wieder reingeht, verpasst genau diese Erholungstage. Deshalb schlägt Dabeibleiben das Rein-und-Raus fast immer, selbst bei schlechtem Timing.", "kernidee": "Dabeibleiben schlägt Timing. Wer die wenigen besten Tage verpasst – und die kommen in der Panik –, verliert den Großteil der Rendite.", "deep_dive": "Zwei berühmte Belege. (1) Die besten Tage verpassen: In vielen untersuchten 20-Jahres-Zeiträumen halbiert sich die Rendite grob, wenn man nur die ~10 besten Börsentage verpasst; verpasst man die besten 20–30 Tage, bleibt fast nichts oder ein Minus übrig. Der Haken: Diese besten Tage clustern direkt neben den schlimmsten (oft innerhalb weniger Wochen). Wer im Crash panisch verkauft, ist genau dann draußen, wenn die kräftigste Erholung kommt. (2) 'Bob, der schlechteste Timer der Welt' (Rechnung von Ben Carlson): Ein Anleger investierte über Jahrzehnte immer nur zum absolut schlechtesten Zeitpunkt – jedes Mal kurz vor einem großen Crash (1972, 1987, 1999, 2007). Perfektes Pech. Trotzdem hatte er am Ende ein Vermögen, weil er NIE verkaufte und einfach investiert blieb. Die Lektion: Dabeibleiben war um ein Vielfaches wichtiger als der Einstiegszeitpunkt. Beide Beispiele sind illustrativ und zeitraumabhängig, aber die Richtung ist robust: Die Marktrendite kommt aus wenigen, unvorhersehbaren Schüben – man muss investiert sein, um sie mitzunehmen.", "key_facts": [{"label": "Beste Tage verpassen", "value": "In vielen 20-J-Zeiträumen halbiert das Verpassen der ~10 besten Tage grob die Rendite; die besten 20–30 zu verpassen frisst fast alles.", "source": "u.a. J.P. Morgan / Putnam-Analysen (illustrativ)"}, {"label": "Erholung kommt in der Panik", "value": "Die besten Tage liegen meist dicht neben den schlimmsten – Panikverkäufer sind genau dann draußen."}, {"label": "Der schlechteste Timer", "value": "Wer immer zum Crash-Hoch kaufte, aber nie verkaufte, endete trotzdem im Plus.", "source": "Ben Carlson, 'Worst Market Timer' (Parabel)"}, {"label": "Kernmechanik", "value": "Rendite entsteht in wenigen, unvorhersehbaren Schüben – man muss dabei sein, um sie zu bekommen."}, {"label": "Praktische Folge", "value": "Nicht verkaufen im Crash; im Zweifel gar nicht auf den Depotstand schauen und den Sparplan weiterlaufen lassen."}], "misconceptions": ["'Ich springe vor dem Crash raus und danach wieder rein.' – Man müsste zweimal richtig liegen; die Erholung wird fast immer verpasst.", "'Cash halten und auf den Tiefpunkt warten ist sicher.' – Man verpasst die stärksten Tage, die genau in der Krise kommen.", "'Nur wer perfekt timt, wird reich.' – Selbst der schlechteste Timer gewann, weil er dabeiblieb."], "related": ["markt-timing-jetzt-ist-schlecht", "sparplan-als-automatik", "sind-etfs-sicher", "anlegerfehler-uebersicht"], "sources": [{"title": "Ben Carlson: The World's Worst Market Timer", "url": "https://awealthofcommonsense.com/2014/02/worlds-worst-market-timer/"}, {"title": "J.P. Morgan Guide to Retirement – Impact of missing best days", "url": "https://am.jpmorgan.com/us/en/asset-management/adv/insights/retirement-insights/guide-to-retirement/"}]}, {"id": "verkauft-ein-etf-aktien", "name": "Verkauft ein ETF überhaupt Aktien?", "aka": ["Handelt ein ETF?", "Kauf und Verkauf im ETF", "Umschlag"], "category": "ETF-Grundlagen", "evidence_level": "A", "tags": ["verkauf", "handel", "rebalancing", "creation-redemption", "kosten"], "summary": "Ja – aber selten und regelbasiert, nie als Reaktion auf fallende Kurse. Ein ETF verkauft (und kauft) nur in zwei Fällen: wenn die Index-Liste sich ändert (Rebalancing) und wenn per Saldo Anleger-Geld rein- oder rausfließt. Ansonsten ist er fast reines Kaufen-und-Halten – genau das macht ihn so billig.", "kernidee": "Ein ETF handelt kaum. Verkauft wird nur, wenn sich der Index ändert oder Anleger ein-/aussteigen – nicht weil ein Kurs fällt.", "deep_dive": "Es gibt keinen Manager, der nach Meinung verkauft. Zwei Auslöser für echte Transaktionen: (1) Index-Umbau/Rebalancing – fällt eine Firma aus dem Index, wird sie verkauft; kommt eine neu rein, wird sie gekauft. Das passiert zu festen Terminen (bei großen Indizes meist quartalsweise). (2) Mittelflüsse – kaufen per Saldo mehr Anleger Anteile, kommt frisches Geld rein und der ETF hält mehr Aktien; verkaufen per Saldo mehr, muss er Aktien abgeben. In der Praxis läuft das über einen Großhandels-Mechanismus (Creation/Redemption über 'Authorized Participants'), sodass der ETF selbst wenig direkt handeln muss. Was ein ETF NICHT tut: wegen eines fallenden Kurses aktiv verkaufen. Der Anteil einer abstürzenden Firma schrumpft von selbst über den Kurs (siehe rechenbeispiel-etf-verlust); aktiv verkauft wird sie erst, wenn sie ganz aus dem Index fliegt – dann ist ihr Gewicht meist schon winzig. Wenig Handel = wenig Kosten, das ist der Grund für die niedrige TER.", "key_facts": [{"label": "Verkauft, wenn …", "value": "eine Firma aus dem Index fällt (Rebalancing) oder per Saldo Anleger aussteigen."}, {"label": "Kauft, wenn …", "value": "eine Firma neu in den Index kommt oder per Saldo frisches Anleger-Geld reinfließt."}, {"label": "Verkauft NICHT, weil …", "value": "ein Kurs fällt – das Gewicht sinkt dann automatisch, ohne Transaktion."}, {"label": "Creation/Redemption", "value": "Ein Großhandels-Mechanismus (Authorized Participants) sorgt dafür, dass der ETF selbst wenig direkt handeln muss."}, {"label": "Wenig Handel = billig", "value": "Der geringe Umschlag ist der Hauptgrund für die sehr niedrigen laufenden Kosten (TER)."}], "misconceptions": ["'Der ETF verkauft eine Firma, sobald ihr Kurs fällt.' – Nein, erst beim Rauswurf aus dem Index (dann Gewicht ~0).", "'Der ETF handelt ständig wie ein aktiver Fonds.' – Nein, er ist überwiegend Kaufen-und-Halten.", "'Ein Manager entscheidet über Käufe/Verkäufe.' – Nein, nur die Index-Regel und die Mittelflüsse."], "related": ["rechenbeispiel-etf-verlust", "index-aufnahme-und-ausschluss", "marktkapitalisierung-gewichtung", "ter-und-kosten"], "sources": [{"title": "BaFin: Wie funktionieren ETFs?", "url": "https://www.bafin.de/DE/Verbraucher/GeldanlageWertpapiere/Investmentfonds/ETF/etf_node.html"}]}, {"id": "vorabpauschale-steuern-de", "name": "ETF-Steuern in Deutschland: Abgeltungsteuer, Freibetrag & Vorabpauschale", "aka": ["Abgeltungsteuer", "Sparerpauschbetrag", "Vorabpauschale", "Teilfreistellung"], "category": "Steuern (DE)", "evidence_level": "B", "tags": ["steuern", "abgeltungsteuer", "vorabpauschale", "freibetrag", "deutschland"], "summary": "In Deutschland fallen auf ETF-Gewinne rund 26,4 % Abgeltungsteuer an (25 % + Soli, ggf. + Kirchensteuer). Der Sparerpauschbetrag stellt 1.000 € Kapitalerträge pro Person und Jahr steuerfrei (2.000 € bei Paaren). Bei Aktien-ETFs sind zusätzlich 30 % der Erträge steuerfrei (Teilfreistellung). Für thesaurierende Fonds gibt es die 'Vorabpauschale', damit auch nicht ausgezahlte Erträge laufend – aber gering – besteuert werden.", "kernidee": "Steuern erst beim Gewinn, ein Freibetrag hilft, und die Vorabpauschale ist meist ein kleiner Vorab-Happen, der später verrechnet wird. Kein Grund zur Angst, aber Freistellungsauftrag nicht vergessen.", "deep_dive": "Gewinne aus ETFs (realisierte Kursgewinne + Ausschüttungen) unterliegen der Abgeltungsteuer von 25 % plus 5,5 % Soli darauf (= 26,375 %), ggf. plus Kirchensteuer. Zwei Erleichterungen: (1) Der Sparerpauschbetrag von 1.000 € je Person und Jahr bleibt steuerfrei – dafür beim Broker einen Freistellungsauftrag einrichten, sonst wird zu viel einbehalten. (2) Bei Aktienfonds sind 30 % der Erträge per Teilfreistellung steuerfrei, um die Vorbelastung im Fonds auszugleichen. Die Vorabpauschale betrifft vor allem thesaurierende Fonds: Da hier nichts ausgezahlt wird, würde ohne sie über Jahrzehnte gar keine Steuer anfallen. Deshalb wird jährlich ein kleiner fiktiver Mindestertrag (abgeleitet aus einem Basiszins × Fondswert, gedeckelt durch die tatsächliche Wertsteigerung) besteuert – oft nur wenige Euro, in Verlustjahren null. Diese bereits gezahlte Steuer wird beim späteren Verkauf angerechnet, du zahlst also nichts doppelt. Bei einem inländischen Broker wird das meist automatisch abgeführt. Hinweis: Steuerregeln ändern sich – das ist eine Orientierung, keine Steuerberatung.", "key_facts": [{"label": "Steuersatz", "value": "25 % Abgeltungsteuer + 5,5 % Soli = 26,375 % (ggf. + Kirchensteuer), auf Gewinne."}, {"label": "Sparerpauschbetrag", "value": "1.000 € pro Person/Jahr steuerfrei (2.000 € zusammenveranlagt) – Freistellungsauftrag beim Broker stellen!"}, {"label": "Teilfreistellung", "value": "Bei Aktien-ETFs sind 30 % der Erträge steuerfrei."}, {"label": "Vorabpauschale", "value": "Kleiner jährlicher Vorab-Steuerhappen auf thesaurierende Fonds (Basiszins-basiert, durch Wertzuwachs gedeckelt); null in Verlustjahren; wird beim Verkauf angerechnet."}, {"label": "Automatik", "value": "Inländische Broker führen Abgeltungsteuer und Vorabpauschale meist automatisch ab."}], "misconceptions": ["'Thesaurierend = steuerfrei bis zum Verkauf.' – Nein, die Vorabpa
