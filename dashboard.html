const DATA = [{"id": "aktiv-vs-passiv", "name": "Aktive Fonds vs. Index-ETF: Warum 'passiv' meist gewinnt", "aka": ["Aktiv vs Passiv", "Stockpicking", "SPIVA"], "category": "Kosten", "evidence_level": "A", "tags": ["aktiv", "passiv", "spiva", "fondsmanager", "kosten"], "summary": "Ein aktiver Fonds versucht, durch Auswahl 'besserer' Aktien den Markt zu schlagen. Die Daten über Jahrzehnte sind eindeutig: Nach Kosten schafft das nur eine Minderheit, und über lange Zeiträume schlägt fast keiner dauerhaft seinen Vergleichsindex. Ein billiger Index-ETF nimmt einfach den Marktdurchschnitt mit – und liegt damit langfristig vor der Mehrheit der Profis.", "kernidee": "Den Markt zu schlagen ist möglich, aber selten und selten dauerhaft. Der Durchschnitt (Index) zu sein, schlägt nach Kosten die meisten Aktiven.", "deep_dive": "Der Grund ist teils simpel-mathematisch (William Sharpe, 'Arithmetic of Active Management'): Alle Anleger zusammen sind der Markt, also ist die Durchschnittsrendite aller Aktiven vor Kosten gleich dem Markt – und nach ihren höheren Kosten zwangsläufig darunter. Die SPIVA-Studien von S&P bestätigen das seit Jahren: Über 10–15 Jahre schlagen 80–90 % der aktiven Aktienfonds ihren Vergleichsindex NICHT. Dazu kommt: Wer heute vorn liegt, ist es morgen selten noch ('keine Persistenz') – Vergangenheits-Ranglisten helfen kaum bei der Auswahl. Das heißt nicht, dass Können nicht existiert; es ist nur teuer, schwer im Voraus zu erkennen und wird von Gebühren aufgefressen. Für Privatanleger ist die robuste Schlussfolgerung: breit, billig, passiv – statt auf den einen Star-Fonds zu wetten.", "key_facts": [{"label": "Langfrist-Bilanz", "value": "Über 10–15 Jahre schlagen rund 80–90 % der aktiven Aktienfonds ihren Index nicht.", "source": "S&P SPIVA Scorecards"}, {"label": "Sharpe-Argument", "value": "Der Durchschnitt aller Aktiven ist vor Kosten = Markt; nach Kosten zwangsläufig darunter.", "source": "Sharpe 1991, 'Arithmetic of Active Management'"}, {"label": "Keine Persistenz", "value": "Heutige Top-Fonds bleiben selten oben – Vergangenheitsrenditen sagen kaum Zukunft voraus."}, {"label": "Survivorship Bias", "value": "Schlechte Fonds werden geschlossen/verschmolzen; Ranglisten sehen dadurch besser aus als die Realität war."}], "misconceptions": ["'Profis schlagen doch sicher den Markt.' – Die Mehrheit tut es nach Kosten langfristig nicht.", "'Ich nehme einfach den Fonds mit der besten 5-Jahres-Rendite.' – Kaum ein Prädiktor; Gewinner wechseln ständig.", "'Passiv heißt, ich verzichte auf Rendite.' – Passiv nimmt den Marktschnitt und liegt damit vor den meisten Aktiven."], "related": ["ter-und-kosten", "was-ist-ein-etf", "welt-etf-auswaehlen"], "sources": [{"title": "S&P SPIVA Scorecards", "url": "https://www.spglobal.com/spdji/en/research-insights/spiva/"}, {"title": "Sharpe: The Arithmetic of Active Management (1991)", "url": "https://web.stanford.edu/~wfsharpe/art/active/active.htm"}]}, {"id": "diversifikation-vs-marktrisiko", "name": "Was Streuung wegnimmt – und was nicht", "aka": ["Diversifikation", "systematisches vs unsystematisches Risiko", "Klumpenrisiko"], "category": "Risiko & Sicherheit", "evidence_level": "A", "tags": ["diversifikation", "risiko", "marktrisiko", "streuung", "korrelation"], "summary": "Streuung über viele Firmen entfernt das Einzelfirmen-Risiko (eine Pleite tut kaum weh) – das ist der ganze Trick eines ETFs. Was Streuung NICHT entfernt, ist das Marktrisiko: Wenn der gesamte Markt fällt (Krise, Rezession, Zinsschock), fällt auch ein breiter ETF. Diese zweite Sorte Risiko lässt sich nur aussitzen, nicht wegdiversifizieren.", "kernidee": "Diversifikation killt das vermeidbare Risiko (einzelne Firma) komplett – aber nicht das unvermeidbare (der ganze Markt).", "deep_dive": "Man unterscheidet zwei Risiko-Arten. Das unsystematische (firmenspezifische) Risiko – schlechtes Management, Skandal, Pleite – lässt sich fast vollständig wegstreuen: Schon ab ~20–30 unterschiedlichen Firmen sinkt es stark, ein Welt-ETF mit >1.000 Firmen macht es praktisch bedeutungslos. Das systematische (Markt-)Risiko dagegen trifft alle gleichzeitig: In 2008 oder im März 2020 fiel fast jede Aktie, weil sich in der Krise die Kurse gemeinsam bewegen (Korrelationen gehen gegen 1). Genau deshalb kann dir ein ETF Drawdowns von −40 bis −55 % bescheren, obwohl er breit gestreut ist. Der einzige bekannte 'Schutz' dagegen ist Zeit (lange Haltedauer, siehe sind-etfs-sicher) und eine Aufteilung über Anlageklassen (z. B. Aktien + Anleihen/Tagesgeld), die sich nicht immer gleich bewegen. Mehr Aktien-ETFs zu kaufen hilft nicht – ein zweiter Welt-ETF streut nichts Neues.", "key_facts": [{"label": "Zwei Risiko-Arten", "value": "Unsystematisch (einzelne Firma) = wegstreubar. Systematisch (ganzer Markt) = bleibt."}, {"label": "Sättigung der Streuung", "value": "Der Großteil des Einzelfirmen-Risikos ist schon bei ~20–30 verschiedenen Firmen weg; darüber sinkt es nur noch langsam.", "source": "Portfoliotheorie (Markowitz/Statman)"}, {"label": "Krisen-Korrelation", "value": "In Crashs fallen fast alle Aktien gemeinsam – Streuung über Aktien allein hilft dann wenig."}, {"label": "Echte Streuung", "value": "Über Anlageklassen (Aktien + Anleihen/Tagesgeld) und Regionen, nicht über zwei ähnliche Aktien-ETFs."}, {"label": "Klumpenrisiko heute", "value": "Im MSCI World stecken ~70 % USA und die größten Tech-Firmen machen einen großen Teil aus – das ist ein realer Konzentrationspunkt, den viele unterschätzen."}], "misconceptions": ["'Mit einem ETF kann ich nichts verlieren.' – Doch: Das Marktrisiko bleibt, −50 % sind historisch möglich.", "'Drei Aktien-ETFs streuen dreimal so gut.' – Meist überlappen sie sich stark; echte Streuung braucht andere Anlageklassen.", "'Diversifikation erhöht die Rendite.' – Sie senkt das Risiko pro Renditeeinheit, sie ist kein Renditeverstärker."], "related": ["marktkapitalisierung-gewichtung", "sind-etfs-sicher", "notgroschen-zuerst"], "sources": [{"title": "Statman: How Many Stocks Make a Diversified Portfolio?", "url": "https://www.jstor.org/stable/2330969"}, {"title": "BaFin: Risiken der Geldanlage", "url": "https://www.bafin.de/DE/Verbraucher/GeldanlageWertpapiere/geldanlage_node.html"}]}, {"id": "index-aufnahme-und-ausschluss", "name": "Rebalancing: Wann kauft und verkauft ein ETF wirklich?", "aka": ["Index-Review", "Rebalancing", "Aufnahme und Ausschluss"], "category": "ETF-Grundlagen", "evidence_level": "A", "tags": ["rebalancing", "index-review", "verkauf", "aufnahme", "kosten"], "summary": "Ein ETF handelt aktiv nur zu festen Terminen (meist quartalsweise), wenn der Index-Anbieter seine Liste überarbeitet: Firmen, die zu klein/unbedeutend geworden sind, fliegen raus und werden verkauft; neue kommen rein und werden gekauft. Zwischen diesen Terminen passiert die Gewichtung automatisch über die Kurse (siehe marktkapitalisierung-gewichtung).", "kernidee": "Verkauft wird eine abgestürzte Firma erst beim planmäßigen Index-Review – und dann ist ihr Gewicht längst fast null. Der eigentliche Verlust ist da schon 'durch'.", "deep_dive": "Der Index-Anbieter (MSCI, S&P, FTSE) prüft in regelmäßigen Reviews, welche Firmen die Aufnahmekriterien noch erfüllen: Mindest-Börsenwert, Streubesitz (frei handelbarer Anteil), Handelsvolumen, Börsenland. Erfüllt eine Firma sie nicht mehr, wird sie zum Stichtag entfernt – der ETF verkauft dann die letzten (kleinen) Restbestände und kauft dafür den Neuzugang. Weil die abstürzende Firma bis dahin schon fast kein Gewicht mehr hat, kostet dieser Verkauf kaum noch etwas – der Wertverlust ist längst passiert, während der Kurs fiel. Genau deshalb hilft es nichts, auf ein 'rechtzeitiges Verkaufen durch den ETF' zu hoffen: Der Schutz kommt nicht aus dem Timing des Verkaufs, sondern aus der breiten Streuung. Kritische Sonderfälle (Übernahme, Insolvenz, Delisting) werden außerplanmäßig behandelt, damit der ETF sauber weiterläuft.", "key_facts": [{"label": "Termine", "value": "Große Indizes werden meist vierteljährlich überprüft (MSCI: Februar, Mai, August, November), manche jährlich."}, {"label": "Aufnahmekriterien", "value": "Mindest-Börsenwert, Streubesitz, Liquidität/Handelsvolumen, Börsensitz. Fällt eine Firma darunter, wird sie entfernt."}, {"label": "Verkauf = spät und klein", "value": "Beim Rauswurf ist das Gewicht der Firma meist schon winzig – der Verlust ist während des Kursverfalls entstanden, nicht erst beim Verkauf."}, {"label": "Umschichtungskosten", "value": "Häufiges Rebalancing verursacht Handelskosten. Deshalb sind ruhige, breite Indizes (wenig Umschlag) tendenziell günstiger und effizienter."}, {"label": "Sonderfälle", "value": "Übernahmen, Fusionen, Insolvenzen oder Delistings werden außerplanmäßig abgewickelt."}], "misconceptions": ["'Der ETF steigt clever aus, bevor eine Firma abstürzt.' – Nein, er reagiert erst beim planmäßigen Review, wenn das Gewicht schon fast null ist.", "'Rebalancing macht mich reicher, weil billig gekauft/teuer verkauft wird.' – Bei cap-gewichteten Indizes ist Rebalancing überwiegend Wartung, kein Renditemotor; es verursacht sogar Kosten.", "'Ich muss selbst umschichten.' – Nein, das erledigt der ETF automatisch nach der Index-Regel."], "related": ["marktkapitalisierung-gewichtung", "was-ist-ein-etf", "diversifikation-vs-marktrisiko"], "sources": [{"title": "MSCI Index Review Termine & Methodik", "url": "https://www.msci.com/our-solutions/indexes/index-review"}, {"title": "S&P Dow Jones Indices – Methodology", "url": "https://www.spglobal.com/spdji/en/documents/methodologies/"}]}, {"id": "marktkapitalisierung-gewichtung", "name": "Wie ein ETF gewichtet – und warum Verlierer von selbst verschwinden", "aka": ["Marktkapitalisierung", "Cap-weighted", "Selbstreinigung des Index"], "category": "ETF-Grundlagen", "evidence_level": "A", "tags": ["gewichtung", "marktkapitalisierung", "rebalancing", "nokia", "risiko"], "summary": "Ein normaler Index-ETF gewichtet jede Firma nach ihrem Börsenwert (Kurs × Anzahl Aktien), NICHT nach Umsatz oder Gewinn. Das hat eine wichtige Folge: Wenn eine Firma abstürzt, schrumpft ihr Anteil im ETF ganz von selbst mit – der ETF muss nichts aktiv verkaufen, um sie kleiner zu machen. Große Gewinner wachsen automatisch, Verlierer verhungern automatisch.", "kernidee": "Der Kurs steuert das Gewicht automatisch. Eine abstürzende Firma wird nicht 'verkauft' – ihr Anteil sinkt einfach mit dem Kurs Richtung null.", "deep_dive": "Beispiel Nokia: Um 2000 war Nokia die wertvollste Firma Europas und machte mehrere Prozent eines Europa-Index aus. Als das Smartphone-Geschäft einbrach, fiel der Kurs – und damit sank Nokias Anteil im Index automatisch: von ~4 % auf 2 %, auf 0,3 %, auf fast null. Niemand musste eine Entscheidung treffen. Der Verlust wurde dabei NICHT weggezaubert: Wer den Index hielt, hat den Absturz mitgemacht – aber immer nur mit dem Anteil, den Nokia gerade noch hatte. Genau das ist der Schutz: In einem MSCI World mit ~1.500 Firmen ist keine einzelne Firma groß genug, um dich ernsthaft zu ruinieren. Wichtig zur Einordnung: Der Index schaut NICHT auf Umsatz oder Gewinn. Eine Firma mit Rekordumsatz, deren Aktie aber fällt, bekommt automatisch weniger Gewicht – weil nur der Börsenwert zählt. Umgekehrt wächst ein neuer Star (z. B. Nvidia) automatisch in den Index hinein, während er steigt.", "key_facts": [{"label": "Gewicht = Börsenwert", "value": "Anteil einer Firma = ihr Börsenwert ÷ Summe aller Börsenwerte im Index. Kurs runter → Anteil runter, ganz ohne Eingriff."}, {"label": "Umsatz zählt NICHT", "value": "Ein cap-gewichteter Index bewertet nach Marktpreis, nicht nach Fundamentaldaten wie Umsatz oder Gewinn. Der Markt 'stimmt' über den Kurs ab."}, {"label": "Automatische Selbstreinigung", "value": "Verlierer schrumpfen von selbst gegen null; Gewinner wachsen von selbst. Der ETF folgt nur der Gewichtung."}, {"label": "Kein Rundum-Schutz", "value": "Der Verlust einer fallenden Firma wird mitgetragen – aber nur anteilig. Bei breiter Streuung ist der Einzelbeitrag klein."}, {"label": "Nokia-Detail", "value": "Nokia ist finnisch und war in Europa-/Welt-Indizes, nicht im US-S&P 100. Das Prinzip ist überall gleich (vgl. Enron, Lehman, Wirecard)."}], "misconceptions": ["'Der ETF verkauft eine abstürzende Firma sofort, um mich zu schützen.' – Nein, der Anteil schrumpft passiv mit dem Kurs; verkauft wird erst beim Rausschmiss aus dem Index (siehe index-aufnahme-und-ausschluss).", "'Firmen mit hohem Umsatz sind im ETF stärker gewichtet.' – Nein, nur der Börsenwert zählt.", "'Eine Pleite kann meinen ETF ruinieren.' – Bei breiter Streuung trägt eine einzelne Firma nur wenige Prozent oder Bruchteile davon."], "related": ["was-ist-ein-etf", "index-aufnahme-und-ausschluss", "diversifikation-vs-marktrisiko"], "sources": [{"title": "MSCI: Index-Methodik (Marktkapitalisierungs-Gewichtung)", "url": "https://www.msci.com/index-methodology"}, {"title": "S&P Dow Jones: Float-Adjusted Market Cap Weighting", "url": "https://www.spglobal.com/spdji/en/education/"}]}, {"id": "notgroschen-zuerst", "name": "Notgroschen zuerst – bevor du investierst", "aka": ["Notreserve", "Emergency Fund", "Liquiditätspuffer"], "category": "Praxis / Erste Schritte", "evidence_level": "A", "tags": ["notgroschen", "sicherheit", "tagesgeld", "erste-schritte", "liquiditaet"], "summary": "Bevor Geld in einen ETF geht, gehört ein Notgroschen auf ein sicheres, jederzeit verfügbares Konto (Tagesgeld). Grund: Ein ETF kann genau dann tief im Minus stehen, wenn du das Geld dringend brauchst (Jobverlust, Reparatur). Der Notgroschen sorgt dafür, dass du nie im ungünstigsten Moment mit Verlust verkaufen musst.", "kernidee": "Erst der Puffer, dann die Rendite. Der Notgroschen ist das, was dir erlaubt, den ETF in Ruhe liegen zu lassen und Krisen auszusitzen.", "deep_dive": "Der häufigste Grund, warum Menschen mit ETFs Geld verlieren, ist erzwungenes Verkaufen im Tief. Wer keinen Puffer hat, muss bei einer unerwarteten Ausgabe genau dann Anteile verkaufen, wenn der Markt vielleicht gerade −40 % steht – der Papierverlust wird real. Ein Notgroschen von etwa 3–6 Monatsausgaben (bei unsicherem Einkommen mehr) auf Tagesgeld löst das: kein Kursrisiko, in ein bis zwei Tagen verfügbar, durch die gesetzliche Einlagensicherung bis 100.000 € je Bank/Kunde geschützt. Dieses Geld ist bewusst NICHT für Rendite da, sondern für Ruhe. Erst was darüber hinaus geht und was du 10+ Jahre nicht brauchst, ist Kandidat für einen ETF.", "key_facts": [{"label": "Höhe", "value": "Grob 3–6 Monatsausgaben; bei schwankendem/unsicherem Einkommen eher 6–12."}, {"label": "Wohin", "value": "Tagesgeld oder Festgeld mit kurzer Laufzeit – kein Kursrisiko, schnell verfügbar."}, {"label": "Einlagensicherung", "value": "In der EU gesetzlich bis 100.000 € je Kunde und Bank geschützt.", "source": "EU-Einlagensicherungsrichtlinie"}, {"label": "Zweck", "value": "Nicht Rendite, sondern die Freiheit, den ETF NIE im Tief verkaufen zu müssen."}, {"label": "Reihenfolge", "value": "1) teure Schulden tilgen 2) Notgroschen aufbauen 3) erst dann breit investieren."}], "misconceptions": ["'Tagesgeld ist Geldverschwendung, alles gehört in den ETF.' – Ohne Puffer wirst du irgendwann im Tief zum Verkauf gezwungen.", "'Der Notgroschen soll auch Rendite bringen.' – Nein, seine Aufgabe ist Sicherheit und Verfügbarkeit."], "related": ["sind-etfs-sicher", "sparplan-vs-einmalanlage", "welt-etf-auswaehlen"], "sources": [{"title": "Verbraucherzentrale: Notreserve / Geldanlage-Grundlagen", "url": "https://www.verbraucherzentrale.de/wissen/geldanlage"}, {"title": "BaFin: Einlagensicherung", "url": "https://www.bafin.de/DE/Verbraucher/Bank/Einlagensicherung/einlagensicherung_node.html"}]}, {"id": "sind-etfs-sicher", "name": "Sind ETFs langfristig 'mathematisch sicher'?", "aka": ["Renditedreieck", "langfristige Sicherheit", "Drawdown", "Aussitzen"], "category": "Risiko & Sicherheit", "evidence_level": "A", "tags": ["sicherheit", "langfristig", "renditedreieck", "drawdown", "japan", "geduld"], "summary": "Ehrliche Antwort: Nein, garantiert sicher sind ETFs nicht – aber breit gestreute Aktien-ETFs sind historisch die robusteste Form, langfristig real (nach Inflation) zu wachsen. Über sehr lange Zeiträume (15+ Jahre) hat ein breiter Welt-Index bisher immer Gewinn gemacht; auf kurze Sicht sind zwischenzeitliche Verluste von −40 bis −55 % völlig normal.", "kernidee": "Nicht 'sicher wie ein Sparbuch', sondern 'sehr wahrscheinlich lohnend, WENN du lange genug (10–15+ Jahre) durchhältst'. Zeit ist der eigentliche Sicherheitsfaktor.", "deep_dive": "Das 'Renditedreieck' des Deutschen Aktieninstituts zeigt für breite Indizes: Je länger die Haltedauer, desto seltener und kleiner die Verlustfälle. Für einen weltweit gestreuten Aktienindex gab es historisch keinen 15-Jahres-Zeitraum mit Verlust. Aber 'historisch' ist keine Garantie – und es gibt Warnbeispiele: Der japanische Nikkei erreichte sein Hoch von Ende 1989 erst wieder um 2024, also nach ~34 Jahren. Ein einzelnes Land kann also sehr lange am Boden liegen – genau deshalb streut man weltweit statt auf ein Land. Zwei Dinge machen das Risiko real: (1) Drawdowns – zwischenzeitliche Rückgänge von 40–55 % kamen mehrfach vor (2000, 2008, 2020) und fühlen sich schrecklich an; wer da panisch verkauft, macht den Verlust echt. (2) Sequenzrisiko – wann genau die Krise fällt, ist bei kurzem Horizont entscheidend. Fazit: 'Mathematisch sicher' im Sinne einer Garantie gibt es nicht. Was es gibt, ist eine sehr robuste Kombination: breit + billig + langfristig + Geld, das du nicht anfassen musst. Das ist der beste allgemein bekannte Kompromiss aus Rendite und Risiko.", "key_facts": [{"label": "Lange Haltedauer", "value": "Für einen breiten Welt-Aktienindex gab es historisch keinen 15-Jahres-Zeitraum mit Verlust – auf 1–5 Jahre sehr wohl.", "source": "Renditedreieck / MSCI-World-Historie"}, {"label": "Normale Drawdowns", "value": "Rückgänge von −40 bis −55 % traten mehrfach auf (2000–2003, 2007–2009, 2020) und erholten sich danach."}, {"label": "Langes-Leiden-Beispiel", "value": "Nikkei 225 (Japan): Hoch Ende 1989 erst um 2024 wieder erreicht – ein Grund, weltweit statt auf ein Land zu setzen."}, {"label": "Reale Rendite", "value": "Weltaktien lieferten langfristig grob ~5–7 % pro Jahr real (nach Inflation) – im Schnitt, nicht garantiert und nicht gleichmäßig.", "source": "Dimson/Marsh/Staunton, Credit Suisse/UBS Yearbook"}, {"label": "Das echte Risiko bist oft du", "value": "Der größte Renditeverlust entsteht durch Panikverkäufe im Tief und Nicht-durchhalten – nicht durch den Markt selbst."}], "misconceptions": ["'ETFs sind so sicher wie Tagesgeld.' – Nein, sie schwanken stark; das Sicherheitsgefühl kommt erst über lange Zeit.", "'Wenn ich breit streue, kann ich nie verlieren.' – Das Marktrisiko bleibt; kurzfristig sind hohe Verluste möglich.", "'Vergangene Rendite garantiert die Zukunft.' – Nein. Japan zeigt, dass Jahrzehnte Stillstand möglich sind – deshalb weltweit streuen."], "related": ["diversifikation-vs-marktrisiko", "sparplan-vs-einmalanlage", "notgroschen-zuerst"], "sources": [{"title": "Deutsches Aktieninstitut – Renditedreieck", "url": "https://www.dai.de/rendite-dreieck/"}, {"title": "UBS Global Investment Returns Yearbook (Dimson/Marsh/Staunton)", "url": "https://www.ubs.com/global/en/investment-bank/in-focus/2023/global-investment-returns-yearbook.html"}]}, {"id": "sparplan-vs-einmalanlage", "name": "Einmal alles anlegen oder gestückelt (Sparplan)?", "aka": ["Lump Sum vs Cost Averaging", "Sparplan", "Durchschnittskosteneffekt"], "category": "Praxis / Erste Schritte", "evidence_level": "B", "tags": ["sparplan", "einmalanlage", "cost-averaging", "psychologie", "timing"], "summary": "Du hast Geld, das lange herumliegt, und fragst dich: alles auf einmal investieren oder über Monate verteilen? Statistisch gewinnt meistens die Einmalanlage, weil Märkte im Schnitt steigen und wartendes Geld Rendite verpasst. Psychologisch ist das gestückelte Einsteigen (z. B. über 6–12 Monate) oft leichter durchzuhalten und schützt vor dem Gefühl, 'genau am Hoch' eingestiegen zu sein.", "kernidee": "Mathe favorisiert leicht die Einmalanlage; Nerven favorisieren das Verteilen. Beide sind vernünftig – Hauptsache, du bleibst dabei.", "deep_dive": "Vanguard und andere haben gezeigt: In der Mehrzahl der historischen Zeiträume (~zwei Drittel) hätte eine sofortige Einmalanlage besser abgeschnitten als gestückeltes Einzahlen – schlicht, weil Aktienmärkte im langfristigen Mittel steigen und jeder Monat 'draußen' im Schnitt Rendite kostet. Der Durchschnittskosteneffekt ('Cost Averaging') ist also KEIN Renditetrick, sondern ein Risiko- und Psychologie-Werkzeug: Er glättet den Einstiegskurs und senkt die Reue, falls kurz nach dem Einstieg ein Crash kommt. Für eine große Summe, die dich nervös macht, ist ein Kompromiss üblich und sinnvoll: einen Teil sofort investieren, den Rest über z. B. 6–12 Monate automatisiert einzahlen. Wichtig: Das ist kein Markt-Timing – du versuchst nicht, den Tiefpunkt zu erraten, sondern nimmst dir nur die Angst vor dem einen falschen Tag. Wer ohnehin monatlich aus dem Einkommen spart, macht sowieso automatisch einen Sparplan.", "key_facts": [{"label": "Statistik", "value": "Einmalanlage schlug gestückeltes Einzahlen historisch in ~2 von 3 Fällen.", "source": "Vanguard: Dollar-Cost Averaging vs Lump Sum"}, {"label": "Warum", "value": "Märkte steigen im langen Mittel; wartendes Geld verpasst diese Aufwärtsdrift."}, {"label": "Cost Averaging ist Psychologie", "value": "Kein Rendite-Trick, sondern Schutz vor Einstiegs-Reue und ein Weg, überhaupt anzufangen."}, {"label": "Praktischer Kompromiss", "value": "Große Summe: z. B. ein Drittel bis Hälfte sofort, Rest automatisiert über 6–12 Monate."}, {"label": "Kein Timing", "value": "Nicht auf den 'richtigen Moment' warten – Zeit im Markt schlägt Timing des Marktes."}], "misconceptions": ["'Sparplan bringt durch den Durchschnittskosteneffekt mehr Rendite.' – Nein, er senkt vor allem Risiko und Reue.", "'Ich warte auf den Crash und steige dann ein.' – Warten kostet im Schnitt Rendite; den Tiefpunkt trifft fast niemand.", "'Alles auf einmal ist immer klüger.' – Statistisch meist, aber wenn dich das lähmt, ist Stückeln besser als gar nicht."], "related": ["sind-etfs-sicher", "notgroschen-zuerst", "welt-etf-auswaehlen"], "sources": [{"title": "Vanguard: Cost averaging vs lump-sum investing", "url": "https://corporate.vanguard.com/content/dam/corp/research/pdf/cost_averaging_invest_now_or_temporarily_hold_your_cash.pdf"}]}, {"id": "ter-und-kosten", "name": "Kosten: TER, Spread & warum billig langfristig gewinnt", "aka": ["Total Expense Ratio", "laufende Kosten", "Spread", "Tracking Difference"], "category": "Kosten", "evidence_level": "A", "tags": ["ter", "kosten", "gebuehren", "spread", "tracking-difference"], "summary": "Kosten sind das Einzige an der Geldanlage, das du sicher kontrollieren kannst – die Rendite nicht. Die wichtigste Zahl ist die TER (Gesamtkostenquote, laufende Fondskosten pro Jahr). Bei breiten ETFs liegt sie bei 0,1–0,25 %. Klingt winzig, macht aber über Jahrzehnte durch den Zinseszins einen großen Unterschied gegenüber aktiven Fonds (~1,5 %).", "kernidee": "Rendite ist ungewiss, Kosten sind sicher. Jeder gesparte Prozentpunkt Gebühr landet direkt in deiner Rendite.", "deep_dive": "Die TER wird laufend intern vom Fondsvermögen abgezogen – du siehst sie nicht als Rechnung, sie steckt schon im Kurs. Über 30 Jahre frisst 1 % mehr Gebühr grob 20–25 % des Endvermögens weg, weil die Kosten jedes Jahr auch auf den entgangenen Zinseszins wirken. Genau das ist der Hauptgrund, warum die meisten aktiven Fonds nach Kosten schlechter abschneiden als ein billiger Index-ETF: Sie müssten ihre höheren Gebühren erst durch Können wieder hereinholen, was langfristig kaum einem gelingt (siehe aktiv-vs-passiv). Neben der TER gibt es zwei weitere Kostenquellen: den Spread (Differenz zwischen Kauf- und Verkaufskurs, klein bei großen liquiden ETFs) und Ordergebühren des Brokers (viele bieten kostenlose Sparpläne). Ein oft besseres Maß als die TER ist die 'Tracking Difference' – wie weit der ETF tatsächlich hinter seinem Index zurückblieb; sie enthält alle realen Kosten und manchmal sogar Zusatzerträge (z. B. aus Wertpapierleihe).", "key_facts": [{"label": "TER breiter ETFs", "value": "0,10–0,25 % pro Jahr; aktive Aktienfonds oft ~1,5 %.", "source": "Anbieter-Factsheets"}, {"label": "Zinseszins-Effekt", "value": "Über ~30 Jahre kann 1 % mehr Gebühr grob 20–25 % weniger Endvermögen bedeuten."}, {"label": "Spread", "value": "Kauf-/Verkaufsdifferenz; bei großen, liquiden Welt-ETFs sehr klein – am größten außerhalb der Haupthandelszeiten."}, {"label": "Ordergebühr", "value": "Broker-abhängig; viele bieten kostenlose Sparpläne auf gängige ETFs."}, {"label": "Tracking Difference", "value": "Aussagekräftiger als TER: die reale Abweichung vom Index über ein Jahr, inkl. aller Effekte."}], "misconceptions": ["'0,2 % gegen 1,5 % ist doch egal.' – Über Jahrzehnte ist das ein großer Unterschied im Endvermögen.", "'Teurer aktiver Fonds = bessere Leistung.' – Meist umgekehrt: Nach Kosten verliert die Mehrheit gegen den Index.", "'Die TER ist eine Rechnung, die ich zahle.' – Nein, sie wird laufend intern abgezogen und steckt schon im Kurs."], "related": ["was-ist-ein-etf", "aktiv-vs-passiv", "welt-etf-auswaehlen"], "sources": [{"title": "SPIVA – Aktive Fonds vs Index (S&P)", "url": "https://www.spglobal.com/spdji/en/research-insights/spiva/"}, {"title": "Verbraucherzentrale: ETF-Kosten", "url": "https://www.verbraucherzentrale.de/wissen/geldanlage/etf"}]}, {"id": "thesaurierend-vs-ausschuettend", "name": "Thesaurierend vs. ausschüttend", "aka": ["Accumulating vs Distributing", "Acc vs Dist", "Dividenden-Wiederanlage"], "category": "ETF-Grundlagen", "evidence_level": "A", "tags": ["thesaurierend", "ausschuettend", "dividenden", "zinseszins", "acc", "dist"], "summary": "ETFs gibt es in zwei Varianten. Thesaurierend (acc): Dividenden werden automatisch im Fonds wieder angelegt – der Anteilswert wächst, du bekommst nichts ausgezahlt. Ausschüttend (dist): Dividenden werden dir aufs Konto überwiesen. Fürs langfristige Vermögensaufbauen ist thesaurierend meist bequemer (automatischer Zinseszins, kein Wiederanlegen nötig).", "kernidee": "Gleicher Index, nur was mit den Dividenden passiert, unterscheidet sich: automatisch reinvestiert (acc) oder ausgezahlt (dist).", "deep_dive": "Beide Varianten bilden denselben Index ab, die Rendite vor Steuern ist praktisch gleich. Der Unterschied ist der Umgang mit Dividenden. Thesaurierend legt sie sofort und kostenlos wieder an – das ist der Zinseszinseffekt auf Autopilot und ideal, wenn du in der Ansparphase bist und das Geld nicht brauchst. Ausschüttend zahlt sie aus – praktisch, wenn du später ein regelmäßiges Einkommen aus dem Depot ziehen willst, oder um in Deutschland gezielt den jährlichen Sparerpauschbetrag (1.000 €/Person steuerfrei) auszunutzen. Steuerlich (DE) gibt es seit 2018 kaum noch einen Nachteil für thesaurierende Fonds, weil die Vorabpauschale dafür sorgt, dass auch nicht ausgezahlte Erträge laufend versteuert werden (siehe vorabpauschale-steuern-de). Für die meisten in der Aufbauphase ist thesaurierend die einfachste Wahl.", "key_facts": [{"label": "Thesaurierend (acc)", "value": "Dividenden werden automatisch im Fonds reinvestiert; Anteilswert steigt, keine Auszahlung. Bequem fürs Ansparen."}, {"label": "Ausschüttend (dist)", "value": "Dividenden landen auf deinem Konto. Gut für regelmäßiges Einkommen oder zum Ausnutzen des Sparerpauschbetrags."}, {"label": "Rendite gleich", "value": "Vor Steuern liefern beide dasselbe – solange bei 'dist' die Ausschüttungen wieder angelegt werden."}, {"label": "Steuer DE", "value": "Seit 2018 kein echter Steuernachteil für acc: die Vorabpauschale besteuert laufend auch nicht ausgezahlte Erträge."}, {"label": "Erkennung", "value": "Im Namen oft 'Acc'/'(C)' vs 'Dist'/'(D)'; steht auch im Factsheet."}], "misconceptions": ["'Ausschüttend bringt mehr, weil ich Dividenden bekomme.' – Nein, bei 'acc' stecken sie im höheren Kurs; Gesamtrendite ist gleich.", "'Thesaurierend spare ich Steuern.' – In DE seit 2018 nicht mehr wesentlich (Vorabpauschale).", "'Dividenden sind Extra-Gewinn.' – Der Kurs sinkt am Ausschüttungstag um die Dividende; es ist keine geschenkte Rendite."], "related": ["was-ist-ein-etf", "vorabpauschale-steuern-de", "ter-und-kosten"], "sources": [{"title": "Verbraucherzentrale: ETF – ausschüttend oder thesaurierend", "url": "https://www.verbraucherzentrale.de/wissen/geldanlage/etf"}]}, {"id": "vorabpauschale-steuern-de", "name": "ETF-Steuern in Deutschland: Abgeltungsteuer, Freibetrag & Vorabpauschale", "aka": ["Abgeltungsteuer", "Sparerpauschbetrag", "Vorabpauschale", "Teilfreistellung"], "category": "Steuern (DE)", "evidence_level": "B", "tags": ["steuern", "abgeltungsteuer", "vorabpauschale", "freibetrag", "deutschland"], "summary": "In Deutschland fallen auf ETF-Gewinne rund 26,4 % Abgeltungsteuer an (25 % + Soli, ggf. + Kirchensteuer). Der Sparerpauschbetrag stellt 1.000 € Kapitalerträge pro Person und Jahr steuerfrei (2.000 € bei Paaren). Bei Aktien-ETFs sind zusätzlich 30 % der Erträge steuerfrei (Teilfreistellung). Für thesaurierende Fonds gibt es die 'Vorabpauschale', damit auch nicht ausgezahlte Erträge laufend – aber gering – besteuert werden.", "kernidee": "Steuern erst beim Gewinn, ein Freibetrag hilft, und die Vorabpauschale ist meist ein kleiner Vorab-Happen, der später verrechnet wird. Kein Grund zur Angst, aber Freistellungsauftrag nicht vergessen.", "deep_dive": "Gewinne aus ETFs (realisierte Kursgewinne + Ausschüttungen) unterliegen der Abgeltungsteuer von 25 % plus 5,5 % Soli darauf (= 26,375 %), ggf. plus Kirchensteuer. Zwei Erleichterungen: (1) Der Sparerpauschbetrag von 1.000 € je Person und Jahr bleibt steuerfrei – dafür beim Broker einen Freistellungsauftrag einrichten, sonst wird zu viel einbehalten. (2) Bei Aktienfonds sind 30 % der Erträge per Teilfreistellung steuerfrei, um die Vorbelastung im Fonds auszugleichen. Die Vorabpauschale betrifft vor allem thesaurierende Fonds: Da hier nichts ausgezahlt wird, würde ohne sie über Jahrzehnte gar keine Steuer anfallen. Deshalb wird jährlich ein kleiner fiktiver Mindestertrag (abgeleitet aus einem Basiszins × Fondswert, gedeckelt durch die tatsächliche Wertsteigerung) besteuert – oft nur wenige Euro, in Verlustjahren null. Diese bereits gezahlte Steuer wird beim späteren Verkauf angerechnet, du zahlst also nichts doppelt. Bei einem inländischen Broker wird das meist automatisch abgeführt. Hinweis: Steuerregeln ändern sich – das ist eine Orientierung, keine Steuerberatung.", "key_facts": [{"label": "Steuersatz", "value": "25 % Abgeltungsteuer + 5,5 % Soli = 26,375 % (ggf. + Kirchensteuer), auf Gewinne."}, {"label": "Sparerpauschbetrag", "value": "1.000 € pro Person/Jahr steuerfrei (2.000 € zusammenveranlagt) – Freistellungsauftrag beim Broker stellen!"}, {"label": "Teilfreistellung", "value": "Bei Aktien-ETFs sind 30 % der Erträge steuerfrei."}, {"label": "Vorabpauschale", "value": "Kleiner jährlicher Vorab-Steuerhappen auf thesaurierende Fonds (Basiszins-basiert, durch Wertzuwachs gedeckelt); null in Verlustjahren; wird beim Verkauf angerechnet."}, {"label": "Automatik", "value": "Inländische Broker führen Abgeltungsteuer und Vorabpauschale meist automatisch ab."}], "misconceptions": ["'Thesaurierend = steuerfrei bis zum Verkauf.' – Nein, die Vorabpauschale greift laufend (aber gering).", "'Die Vorabpauschale ist eine Doppelbesteuerung.' – Nein, sie wird beim Verkauf angerechnet.", "'Ohne Freistellungsauftrag ist es egal.' – Dann wird ab dem ersten Euro Steuer einbehalten, obwohl 1.000 € frei wären (rückholbar nur über die Steuererklärung)."], "related": ["thesaurierend-vs-ausschuettend", "ter-und-kosten", "welt-etf-auswaehlen"], "sources": [{"title": "Bundesfinanzministerium: Investmentsteuerreform / Vorabpauschale", "url": "https://www.bundesfinanzministerium.de/"}, {"title": "Finanztip: ETF-Steuern & Vorabpauschale", "url": "https://www.finanztip.de/indexfonds-etf/etf-steuer/"}]}, {"id": "was-ist-ein-etf", "name": "Was ist ein ETF?", "aka": ["Exchange Traded Fund", "Indexfonds", "Passivfonds"], "category": "ETF-Grundlagen", "evidence_level": "A", "tags": ["etf", "index", "grundlagen", "fonds", "diversifikation"], "summary": "Ein ETF ist ein an der Börse handelbarer Korb aus vielen Aktien (oder Anleihen). Du kaufst mit einem einzigen Anteil einen winzigen Bruchteil von hunderten oder tausenden Firmen gleichzeitig. Ein ETF bildet meist einen Index nach (z. B. MSCI World, S&P 500) und wird deshalb 'passiv' verwaltet – kein Fondsmanager wählt Aktien aus, sondern eine feste Regel.", "kernidee": "Ein Anteil = ein ganzer Firmenkorb. Du wettest nicht auf eine Firma, sondern besitzt einen Ausschnitt des ganzen Marktes.", "deep_dive": "Ein Index (z. B. MSCI World) ist nur eine Liste von Firmen mit einer Rechenregel, wie stark jede Firma zählt. Der ETF-Anbieter (iShares, Vanguard, Xtrackers …) kauft die echten Aktien in genau diesen Verhältnissen und zerlegt das Ganze in viele kleine Anteile, die du wie eine einzelne Aktie an der Börse kaufst. Weil keine teuren Analysten Einzelaktien auswählen, sind die laufenden Kosten sehr niedrig (oft 0,1–0,25 % pro Jahr, siehe ter-und-kosten). Dein Anteil ist rechtlich Sondervermögen: geht der ETF-Anbieter pleite, gehören die Aktien weiter dir, sie sind vor den Gläubigern des Anbieters geschützt.", "key_facts": [{"label": "Streuung", "value": "Ein MSCI-World-ETF enthält ~1.400–1.500 Firmen aus 23 Industrieländern; ein FTSE All-World ~3.700 Firmen inkl. Schwellenländer."}, {"label": "Kosten", "value": "Typische Gesamtkostenquote (TER) 0,10–0,25 % pro Jahr – ein Bruchteil aktiver Fonds (~1,5 %).", "source": "TER-Angaben der Anbieter"}, {"label": "Handelbar", "value": "Kauf/Verkauf jederzeit während der Börsenzeiten, wie eine Aktie – anders als klassische Fonds, die nur einmal täglich abgerechnet werden."}, {"label": "Sondervermögen", "value": "Bei Anbieter-Pleite bleibt dein Anteil deiner – die Wertpapiere sind vom Vermögen des Anbieters getrennt."}, {"label": "Zwei Bauarten", "value": "Physisch (der ETF hält die echten Aktien) oder synthetisch (bildet den Index über einen Tauschvertrag/Swap nach). Für Einsteiger ist physisch üblicher und einfacher."}], "misconceptions": ["'Ein ETF ist eine Aktie.' – Nein, es ist ein Korb aus vielen Aktien.", "'Ein Fondsmanager wählt clever die besten Aktien.' – Bei einem Index-ETF entscheidet eine feste Regel, kein Mensch.", "'Wenn der ETF-Anbieter pleitegeht, ist mein Geld weg.' – Nein, es ist geschütztes Sondervermögen."], "related": ["marktkapitalisierung-gewichtung", "diversifikation-vs-marktrisiko", "ter-und-kosten"], "sources": [{"title": "BaFin: Was sind ETFs?", "url": "https://www.bafin.de/DE/Verbraucher/GeldanlageWertpapiere/Investmentfonds/ETF/etf_node.html"}, {"title": "MSCI World Index (Übersicht)", "url": "https://www.msci.com/indexes/index/990100"}]}, {"id": "welt-etf-auswaehlen", "name": "Einen breiten Welt-ETF auswählen (Praxis)", "aka": ["MSCI World", "FTSE All-World", "ACWI", "1-ETF-Lösung"], "category": "Praxis / Erste Schritte", "evidence_level": "B", "tags": ["msci-world", "ftse-all-world", "auswahl", "praxis", "index"], "summary": "Für 'lange liegen lassen und breit gestreut' reicht in der Praxis oft ein einziger, breiter, weltweiter Aktien-ETF. Gängige Basis-Indizes: MSCI World (~1.500 Firmen, Industrieländer), FTSE All-World oder MSCI ACWI (inkl. Schwellenländer, ~3.700 bzw. ~2.900 Firmen). Achte auf: breiter Index, große Fondsgröße, niedrige TER, physisch replizierend, thesaurierend (fürs Ansparen).", "kernidee": "Ein breiter Welt-ETF ist die einfache, robuste Standardlösung. Kompliziert wird es nur, wenn man es kompliziert macht.", "deep_dive": "Die häufigste Einsteiger-Lösung ist ein einzelner Welt-ETF. MSCI World deckt ~23 Industrieländer ab (aber KEINE Schwellenländer und aktuell ~70 % USA-Gewicht). Wer auch Schwellenländer will, nimmt FTSE All-World oder MSCI ACWI – ein Produkt, das automatisch die ganze Welt inkl. China/Indien/Brasilien mitnimmt. Beides ist vertretbar; wichtiger als die Feinheit ist, überhaupt breit und günstig zu starten. Auswahl-Checkliste: (1) Index breit genug (Welt statt einzelnes Land/Branche). (2) Fondsvolumen groß (>500 Mio. €) – kleine ETFs werden eher geschlossen. (3) TER niedrig (≤0,25 %). (4) Replikation physisch (hält echte Aktien) statt synthetisch – einfacher zu verstehen. (5) Acc vs Dist nach Ziel (siehe thesaurierend-vs-ausschuettend). (6) Alter/Auflagedatum – ein paar Jahre Historie ist beruhigend. Achtung Modeprodukte: Themen-/Branchen-ETFs (KI, Wasserstoff, einzelne Länder) sind KEINE breite Streuung, sondern konzentrierte Wetten – für den Kern ungeeignet.", "key_facts": [{"label": "MSCI World", "value": "~1.500 Firmen, 23 Industrieländer, keine Schwellenländer, aktuell ~70 % USA."}, {"label": "FTSE All-World / MSCI ACWI", "value": "Inkl. Schwellenländer (~3.700 bzw. ~2.900 Firmen) – 'die ganze Welt in einem Produkt'."}, {"label": "Checkliste", "value": "Breiter Index · Volumen >500 Mio. € · TER ≤0,25 % · physisch replizierend · acc/dist nach Ziel · einige Jahre Historie."}, {"label": "Modeprodukte meiden", "value": "Themen-/Branchen-/Einzelland-ETFs sind Wetten, keine Streuung – nicht als Kern nehmen."}, {"label": "Optionaler Baustein", "value": "Wer Schwankung dämpfen will, ergänzt sichere Anlagen (Tagesgeld/kurze Anleihen) – die eigentliche Risiko-Stellschraube."}], "misconceptions": ["'Ich brauche viele verschiedene ETFs.' – Ein breiter Welt-ETF ist schon extrem gestreut; mehr Aktien-ETFs überlappen meist.", "'Ein KI-/Themen-ETF ist besonders breit und modern.' – Nein, das ist eine konzentrierte Branchenwette.", "'Der ETF mit der besten letzten Jahresrendite ist der beste.' – Vergangenheitsrendite ist kein verlässlicher Wegweiser."], "related": ["diversifikation-vs-marktrisiko", "ter-und-kosten", "thesaurierend-vs-ausschuettend", "notgroschen-zuerst"], "sources": [{"title": "Finanztip: Welt-ETF / Basisanlage", "url": "https://www.finanztip.de/indexfonds-etf/"}, {"title": "Verbraucherzentrale: Mit ETF Vermögen aufbauen", "url": "https://www.verbraucherzentrale.de/wissen/geldanlage/etf"}]}];
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function kfHtml(k){return `<div class="kf"><div class="l">${esc(k.label)}</div><div>${esc(k.value)}</div>${k.source?`<div class="s">Quelle: ${esc(k.source)}</div>`:''}</div>`;}
function cardHtml(c){
  const lvl=c.evidence_level||'C';
  const kf=(c.key_facts||[]).map(kfHtml).join('');
  const miss=(c.misconceptions||[]).map(m=>`<li>${esc(m)}</li>`).join('');
  const src=(c.sources||[]).map(s=>`<div class="src"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></div>`).join('');
  const rel=(c.related||[]).map(r=>`<a href="#" data-go="${esc(r)}">→ ${esc(r)}</a>`).join('');
  return `<div class="card" id="${esc(c.id)}" data-txt="${esc((c.name+' '+c.summary+' '+(c.tags||[]).join(' ')+' '+c.category).toLowerCase())}" data-cat="${esc(c.category)}">
    <div class="head"><h2>${esc(c.name)}</h2><span class="lvl ${lvl}">Evidenz ${lvl}</span><span class="cat">${esc(c.category)}</span></div>
    <div class="kern"><b>Kernidee:</b> ${esc(c.kernidee)}</div>
    <div class="body">
      <div class="summary">${esc(c.summary)}</div>
      ${c.deep_dive?`<div class="deep">${esc(c.deep_dive)}</div>`:''}
      ${kf?`<h3>Fakten</h3>${kf}`:''}
      ${miss?`<h3>Häufige Irrtümer</h3><ul class="miss">${miss}</ul>`:''}
      ${rel?`<h3>Verwandt</h3><div class="rel">${rel}</div>`:''}
      ${src?`<h3>Quellen</h3><div class="src">${src}</div>`:''}
    </div>
  </div>`;
}
const list=document.getElementById('list');
function draw(){
  const q=document.getElementById('q').value.toLowerCase().trim();
  const cat=document.getElementById('cat').value;
  const rows=DATA.filter(c=>(!cat||c.category===cat)&&(!q||(c.name+' '+c.summary+' '+(c.tags||[]).join(' ')+' '+c.category).toLowerCase().includes(q)));
  list.innerHTML=rows.length?rows.map(cardHtml).join(''):'<div class="none">Nichts gefunden.</div>';
}
list.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');
  if(go){e.preventDefault();const t=document.getElementById(go.dataset.go);if(t){document.getElementById('q').value='';document.getElementById('cat').value='';draw();const el=document.getElementById(go.dataset.go);el.classList.add('open');el.scrollIntoView({behavior:'smooth',block:'start'});}return;}
  const h=e.target.closest('.head');if(h)h.parentElement.classList.toggle('open');
});
document.getElementById('q').addEventListener('input',draw);
document.getElementById('cat').addEventListener('change',draw);
draw();
</script>
</body>
