uschale greift laufend (aber gering).", "'Die Vorabpauschale ist eine Doppelbesteuerung.' – Nein, sie wird beim Verkauf angerechnet.", "'Ohne Freistellungsauftrag ist es egal.' – Dann wird ab dem ersten Euro Steuer einbehalten, obwohl 1.000 € frei wären (rückholbar nur über die Steuererklärung)."], "related": ["thesaurierend-vs-ausschuettend", "ter-und-kosten", "welt-etf-auswaehlen"], "sources": [{"title": "Bundesfinanzministerium: Investmentsteuerreform / Vorabpauschale", "url": "https://www.bundesfinanzministerium.de/"}, {"title": "Finanztip: ETF-Steuern & Vorabpauschale", "url": "https://www.finanztip.de/indexfonds-etf/etf-steuer/"}]}, {"id": "warum-aktien-langfristig-steigen", "name": "Warum steigen Aktien langfristig? Die Wette dahinter", "aka": ["Equity Risk Premium", "produktive Sachwerte", "die eigentliche Wette"], "category": "Wirtschaft & Wachstum", "evidence_level": "B", "tags": ["rendite", "wachstum", "produktivitaet", "dividenden", "zinseszins", "wette"], "summary": "Ein breiter Aktien-ETF steigt langfristig nicht durch Zauberei, sondern weil er ein Anteil an produktiven Firmen ist, die reale Werte schaffen. Die Rendite kommt aus vier Quellen: reinvestierte Gewinne, Produktivitäts-/Innovationswachstum, Dividenden und dem Weitergeben der Inflation. Garantiert ist das nicht – aber es ist eine begründete Wette darauf, dass die Menschheit weiter produziert und wirtschaftet.", "kernidee": "Du wettest nicht auf einzelne Firmen, sondern darauf, dass Menschen langfristig mehr und Besseres produzieren. Aktien sind der Anteil an dieser Produktion.", "deep_dive": "Eine Aktie ist ein Anteil an einem echten Unternehmen mit Fabriken, Marken, Patenten, Kunden und Mitarbeitern – ein Sachwert, der laufend etwas produziert. Vier Renditequellen: (1) Reinvestierte Gewinne – Firmen behalten einen Teil des Gewinns ein und investieren ihn (neue Anlagen, Forschung); sie wachsen aus sich selbst, ein Zinseszins auf Unternehmensebene. (2) Produktivität & Innovation – mit besseren Werkzeugen/Wissen wird pro Arbeitsstunde real mehr hergestellt (siehe wirtschaftswachstum-real). (3) Dividenden – ein Teil des Gewinns wird direkt ausgeschüttet. (4) Inflationsweitergabe – steigen die Preise, steigen Umsatz und Gewinn nominal mit, anders als bei Bargeld (siehe inflation-nominal-vs-real). Historisch ergab das für breite Weltaktien grob 5–7 % pro Jahr real (nach Inflation). Verstärkt wird das durch die Selbsterneuerung des Index: Verlierer schrumpfen automatisch heraus, neue Gewinner wachsen hinein – du musst nie umschichten. Wichtig: Das ist eine begründete Erwartung ('Equity Risk Premium' als Lohn fürs Aushalten der Schwankung), kein Naturgesetz. Kurzfristig kann es -40 bis -55 % nach unten gehen; einzelne Länder können Jahrzehnte stagnieren (Japan). Deshalb: weltweit streuen und lange dabeibleiben.", "key_facts": [{"label": "Vier Renditequellen", "value": "Reinvestierte Gewinne + Produktivität/Innovation + Dividenden + Inflationsweitergabe."}, {"label": "Reale Rendite", "value": "Breite Weltaktien lieferten langfristig grob ~5–7 % pro Jahr real (nach Inflation), im Schnitt – nicht garantiert, nicht gleichmäßig.", "source": "Dimson/Marsh/Staunton, UBS Yearbook"}, {"label": "Risikoprämie", "value": "Die Mehrrendite gegenüber sicherem Geld ist der Lohn dafür, die Schwankungen auszuhalten ('Equity Risk Premium')."}, {"label": "Selbsterneuerung", "value": "Der Index tauscht Verlierer automatisch gegen neue Gewinner – die Wette gilt der Wirtschaft insgesamt, nicht einzelnen Firmen."}, {"label": "Keine Garantie", "value": "Begründete Erwartung, kein Gesetz: -50 % kurzfristig möglich, einzelne Regionen können Jahrzehnte stagnieren."}], "misconceptions": ["'Aktien steigen einfach immer.' – Nein, nur langfristig und wahrscheinlich; kurzfristig sind heftige Verluste normal.", "'Die Rendite kommt nur aus steigenden Kursen.' – Ein großer Teil kommt aus reinvestierten Gewinnen und Dividenden.", "'Wenn eine große Firma stirbt, stirbt die Wette.' – Der Index erneuert sich; die Wette gilt der Gesamtwirtschaft."], "related": ["wirtschaftswachstum-real", "inflation-nominal-vs-real", "sind-etfs-sicher", "marktkapitalisierung-gewichtung"], "sources": [{"title": "UBS Global Investment Returns Yearbook (Dimson/Marsh/Staunton)", "url": "https://www.ubs.com/global/en/investment-bank/in-focus/2023/global-investment-returns-yearbook.html"}]}, {"id": "was-ist-ein-etf", "name": "Was ist ein ETF?", "aka": ["Exchange Traded Fund", "Indexfonds", "Passivfonds"], "category": "ETF-Grundlagen", "evidence_level": "A", "tags": ["etf", "index", "grundlagen", "fonds", "diversifikation"], "summary": "Ein ETF ist ein an der Börse handelbarer Korb aus vielen Aktien (oder Anleihen). Du kaufst mit einem einzigen Anteil einen winzigen Bruchteil von hunderten oder tausenden Firmen gleichzeitig. Ein ETF bildet meist einen Index nach (z. B. MSCI World, S&P 500) und wird deshalb 'passiv' verwaltet – kein Fondsmanager wählt Aktien aus, sondern eine feste Regel.", "kernidee": "Ein Anteil = ein ganzer Firmenkorb. Du wettest nicht auf eine Firma, sondern besitzt einen Ausschnitt des ganzen Marktes.", "deep_dive": "Ein Index (z. B. MSCI World) ist nur eine Liste von Firmen mit einer Rechenregel, wie stark jede Firma zählt. Der ETF-Anbieter (iShares, Vanguard, Xtrackers …) kauft die echten Aktien in genau diesen Verhältnissen und zerlegt das Ganze in viele kleine Anteile, die du wie eine einzelne Aktie an der Börse kaufst. Weil keine teuren Analysten Einzelaktien auswählen, sind die laufenden Kosten sehr niedrig (oft 0,1–0,25 % pro Jahr, siehe ter-und-kosten). Dein Anteil ist rechtlich Sondervermögen: geht der ETF-Anbieter pleite, gehören die Aktien weiter dir, sie sind vor den Gläubigern des Anbieters geschützt.", "key_facts": [{"label": "Streuung", "value": "Ein MSCI-World-ETF enthält ~1.400–1.500 Firmen aus 23 Industrieländern; ein FTSE All-World ~3.700 Firmen inkl. Schwellenländer."}, {"label": "Kosten", "value": "Typische Gesamtkostenquote (TER) 0,10–0,25 % pro Jahr – ein Bruchteil aktiver Fonds (~1,5 %).", "source": "TER-Angaben der Anbieter"}, {"label": "Handelbar", "value": "Kauf/Verkauf jederzeit während der Börsenzeiten, wie eine Aktie – anders als klassische Fonds, die nur einmal täglich abgerechnet werden."}, {"label": "Sondervermögen", "value": "Bei Anbieter-Pleite bleibt dein Anteil deiner – die Wertpapiere sind vom Vermögen des Anbieters getrennt."}, {"label": "Zwei Bauarten", "value": "Physisch (der ETF hält die echten Aktien) oder synthetisch (bildet den Index über einen Tauschvertrag/Swap nach). Für Einsteiger ist physisch üblicher und einfacher."}], "misconceptions": ["'Ein ETF ist eine Aktie.' – Nein, es ist ein Korb aus vielen Aktien.", "'Ein Fondsmanager wählt clever die besten Aktien.' – Bei einem Index-ETF entscheidet eine feste Regel, kein Mensch.", "'Wenn der ETF-Anbieter pleitegeht, ist mein Geld weg.' – Nein, es ist geschütztes Sondervermögen."], "related": ["marktkapitalisierung-gewichtung", "diversifikation-vs-marktrisiko", "ter-und-kosten"], "sources": [{"title": "BaFin: Was sind ETFs?", "url": "https://www.bafin.de/DE/Verbraucher/GeldanlageWertpapiere/Investmentfonds/ETF/etf_node.html"}, {"title": "MSCI World Index (Übersicht)", "url": "https://www.msci.com/indexes/index/990100"}]}, {"id": "welt-etf-auswaehlen", "name": "Einen breiten Welt-ETF auswählen (Praxis)", "aka": ["MSCI World", "FTSE All-World", "ACWI", "1-ETF-Lösung"], "category": "Praxis / Erste Schritte", "evidence_level": "B", "tags": ["msci-world", "ftse-all-world", "auswahl", "praxis", "index"], "summary": "Für 'lange liegen lassen und breit gestreut' reicht in der Praxis oft ein einziger, breiter, weltweiter Aktien-ETF. Gängige Basis-Indizes: MSCI World (~1.500 Firmen, Industrieländer), FTSE All-World oder MSCI ACWI (inkl. Schwellenländer, ~3.700 bzw. ~2.900 Firmen). Achte auf: breiter Index, große Fondsgröße, niedrige TER, physisch replizierend, thesaurierend (fürs Ansparen).", "kernidee": "Ein breiter Welt-ETF ist die einfache, robuste Standardlösung. Kompliziert wird es nur, wenn man es kompliziert macht.", "deep_dive": "Die häufigste Einsteiger-Lösung ist ein einzelner Welt-ETF. MSCI World deckt ~23 Industrieländer ab (aber KEINE Schwellenländer und aktuell ~70 % USA-Gewicht). Wer auch Schwellenländer will, nimmt FTSE All-World oder MSCI ACWI – ein Produkt, das automatisch die ganze Welt inkl. China/Indien/Brasilien mitnimmt. Beides ist vertretbar; wichtiger als die Feinheit ist, überhaupt breit und günstig zu starten. Auswahl-Checkliste: (1) Index breit genug (Welt statt einzelnes Land/Branche). (2) Fondsvolumen groß (>500 Mio. €) – kleine ETFs werden eher geschlossen. (3) TER niedrig (≤0,25 %). (4) Replikation physisch (hält echte Aktien) statt synthetisch – einfacher zu verstehen. (5) Acc vs Dist nach Ziel (siehe thesaurierend-vs-ausschuettend). (6) Alter/Auflagedatum – ein paar Jahre Historie ist beruhigend. Achtung Modeprodukte: Themen-/Branchen-ETFs (KI, Wasserstoff, einzelne Länder) sind KEINE breite Streuung, sondern konzentrierte Wetten – für den Kern ungeeignet.", "key_facts": [{"label": "MSCI World", "value": "~1.500 Firmen, 23 Industrieländer, keine Schwellenländer, aktuell ~70 % USA."}, {"label": "FTSE All-World / MSCI ACWI", "value": "Inkl. Schwellenländer (~3.700 bzw. ~2.900 Firmen) – 'die ganze Welt in einem Produkt'."}, {"label": "Checkliste", "value": "Breiter Index · Volumen >500 Mio. € · TER ≤0,25 % · physisch replizierend · acc/dist nach Ziel · einige Jahre Historie."}, {"label": "Modeprodukte meiden", "value": "Themen-/Branchen-/Einzelland-ETFs sind Wetten, keine Streuung – nicht als Kern nehmen."}, {"label": "Optionaler Baustein", "value": "Wer Schwankung dämpfen will, ergänzt sichere Anlagen (Tagesgeld/kurze Anleihen) – die eigentliche Risiko-Stellschraube."}], "misconceptions": ["'Ich brauche viele verschiedene ETFs.' – Ein breiter Welt-ETF ist schon extrem gestreut; mehr Aktien-ETFs überlappen meist.", "'Ein KI-/Themen-ETF ist besonders breit und modern.' – Nein, das ist eine konzentrierte Branchenwette.", "'Der ETF mit der besten letzten Jahresrendite ist der beste.' – Vergangenheitsrendite ist kein verlässlicher Wegweiser."], "related": ["diversifikation-vs-marktrisiko", "ter-und-kosten", "thesaurierend-vs-ausschuettend", "notgroschen-zuerst"], "sources": [{"title": "Finanztip: Welt-ETF / Basisanlage", "url": "https://www.finanztip.de/indexfonds-etf/"}, {"title": "Verbraucherzentrale: Mit ETF Vermögen aufbauen", "url": "https://www.verbraucherzentrale.de/wissen/geldanlage/etf"}]}, {"id": "wirtschaftswachstum-real", "name": "Was reales Wirtschaftswachstum wirklich ist (kein Nullsummenspiel)", "aka": ["Produktivität", "reales BIP", "der Kuchen wächst"], "category": "Wirtschaft & Wachstum", "evidence_level": "A", "tags": ["wachstum", "produktivitaet", "bip", "real", "nullsummenspiel", "wohlstand"], "summary": "Wenn der Umsatz nur wegen Inflation steigt, ist das tatsächlich ein Nullsummenspiel – niemand wird reicher. Reales Wirtschaftswachstum ist etwas anderes: Es bedeutet, dass physisch MEHR und BESSERE Güter und Dienstleistungen entstehen, vor allem durch Produktivität (mehr Output pro Arbeitsstunde). Weil der 'Kuchen' dabei wirklich größer wird, ist es kein Nullsummenspiel.", "kernidee": "Inflation = höhere Preise (Wash). Reales Wachstum = mehr echte Dinge. Nur das Zweite schafft neuen Wohlstand – und es nimmt niemandem etwas weg.", "deep_dive": "Der Inflationsanteil am Umsatzwachstum ist ein Nullsummenspiel: Verdoppeln sich Preise UND Löhne, kann man sich gleich viel kaufen. Reales Wachstum dagegen heißt: mehr Menge und Qualität bei gleichem oder weniger Aufwand. Motor ist die Produktivität. Beispiel Landwirtschaft: 1900 bearbeitete ein Bauer mit Pferd ~1 Hektar/Tag, heute einer mit Traktor ~50 Hektar/Tag – 50× mehr Nahrung vom gleichen Menschen. Diese zusätzliche Nahrung ist real neu, sie entstand durch ein besseres Werkzeug, nicht durch Preiserhöhung. Beispiel Smartphone: kostet real ähnlich wie ein Handy von 1995, kann aber das Tausendfache – mehr echter Wert fürs gleiche Geld. Warum KEIN Nullsummenspiel: Der Traktor nimmt niemandem die 49 zusätzlichen Hektar weg; die Nahrung existiert schlicht zusätzlich. Deshalb konnten die Lebensstandards in 250 Jahren für fast alle gleichzeitig steigen – neu geschaffen, nicht umverteilt. Quellen realen Wachstums: (1) Produktivität/Technik (größter Hebel), (2) mehr Einsatz (Menschen, Kapital), (3) neue Produkte/Märkte (Internet, Medikamente), (4) Spezialisierung & Handel. Gemessen wird es über das REALE BIP (nominales BIP minus Inflation, per Preisindex bereinigt). 'Die Wirtschaft wuchs 2 %' meint immer real. Ehrlich: Reales Wachstum ist kein Naturgesetz – es lief ~250 Jahre robust, ist aber nicht garantiert (Ressourcen, Demografie, Produktivitätsflauten); einzelne Länder können stagnieren.", "key_facts": [{"label": "Nominal = Inflation + real", "value": "Nur der reale Teil (nach Inflation) ist echter Wohlstandszuwachs."}, {"label": "Produktivität", "value": "Mehr Output pro Arbeitsstunde durch bessere Werkzeuge/Wissen – der Hauptmotor des Wachstums."}, {"label": "Traktor-Beispiel", "value": "1 Hektar/Tag (Pferd, 1900) -> ~50 Hektar/Tag (Traktor): 50× mehr, real neu, nicht durch Preise."}, {"label": "Kein Nullsummenspiel", "value": "Der Kuchen wird physisch größer; die Zusatzgüter nehmen niemandem etwas weg."}, {"label": "Gemessen als reales BIP", "value": "Nominales BIP wird um die Inflation bereinigt; nur der Rest zählt als Wachstum."}, {"label": "Keine Garantie", "value": "Historisch robust über ~250 Jahre, aber kein Gesetz – einzelne Länder/Zeiten stagnieren."}], "misconceptions": ["'Wachstum ist nur Inflation.' – Der Inflationsteil ist ein Wash; das reale Wachstum ist echter Mehr-Output.", "'Wenn einer gewinnt, verliert ein anderer.' – Reales Wachstum vergrößert den Kuchen, es ist kein Nullsummenspiel.", "'BIP-Wachstum meint mehr Geld.' – Es meint (real) mehr und bessere Güter und Dienstleistungen."], "related": ["inflation-nominal-vs-real", "bip-messproblem-qualitaetsbereinigung", "warum-aktien-langfristig-steigen"], "sources": [{"title": "OECD: Productivity and long-term growth (Erklärungen)", "url": "https://www.oecd.org/en/topics/productivity.html"}, {"title": "Our World in Data: Economic Growth", "url": "https://ourworldindata.org/economic-growth"}]}];
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function kfHtml(k){return `<div class="kf"><div class="l">${esc(k.label)}</div><div>${esc(k.value)}</div>${k.source?`<div class="s">Quelle: ${esc(k.source)}</div>`:''}</div>`;}
function cardHtml(c){
  const lvl=c.evidence_level||'C';
  const kf=(c.key_facts||[]).map(kfHtml).join('');
  const miss=(c.misconceptions||[]).map(m=>`<li>${esc(m)}</li>`).join('');
  const src=(c.sources||[]).map(s=>`<div class="src"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></div>`).join('');
  const rel=(c.related||[]).map(r=>`<a href="#" data-go="${esc(r)}">→ ${esc(r)}</a>`).join('');
  return `<div class="card" id="${esc(c.id)}" data-txt="${esc((c.name+' '+c.summary+' '+(c.tags||[]).join(' ')+' '+c.category).toLowerCase())}" data-cat="${esc(c.category)}">
    <div class="head"><h2>${esc(c.name)}</h2><span class="lvl ${lvl}">Evidenz ${lvl}</span><span class="cat">${esc(c.category)}</span></div>
    <div class="kern"><b>Kernidee:</b> ${esc(c.kernidee)}</div>
    <div class="body">
      <div class="summary">${esc(c.summary)}</div>
      ${c.deep_dive?`<div class="deep">${esc(c.deep_dive)}</div>`:''}
      ${kf?`<h3>Fakten</h3>${kf}`:''}
      ${miss?`<h3>Häufige Irrtümer</h3><ul class="miss">${miss}</ul>`:''}
      ${rel?`<h3>Verwandt</h3><div class="rel">${rel}</div>`:''}
      ${src?`<h3>Quellen</h3><div class="src">${src}</div>`:''}
    </div>
  </div>`;
}
const list=document.getElementById('list');
function draw(){
  const q=document.getElementById('q').value.toLowerCase().trim();
  const cat=document.getElementById('cat').value;
  const rows=DATA.filter(c=>(!cat||c.category===cat)&&(!q||(c.name+' '+c.summary+' '+(c.tags||[]).join(' ')+' '+c.category).toLowerCase().includes(q)));
  list.innerHTML=rows.length?rows.map(cardHtml).join(''):'<div class="none">Nichts gefunden.</div>';
}
list.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');
  if(go){e.preventDefault();const t=document.getElementById(go.dataset.go);if(t){document.getElementById('q').value='';document.getElementById('cat').value='';draw();const el=document.getElementById(go.dataset.go);el.classList.add('open');el.scrollIntoView({behavior:'smooth',block:'start'});}return;}
  const h=e.target.closest('.head');if(h)h.parentElement.classList.toggle('open');
});
document.getElementById('q').addEventListener('input',draw);
document.getElementById('cat').addEventListener('change',draw);
draw();
</script>
